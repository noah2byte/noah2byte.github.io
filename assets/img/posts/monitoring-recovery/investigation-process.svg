<svg width="1000" height="554" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 554" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369A1"/></marker></defs><rect width="1000" height="554" fill="#FFFFFF"/><text x="20" y="32" font-size="17" fill="#111827" font-weight="700">현황 파악 과정 — 겉에서 안으로, 보내는 쪽에서 받는 쪽으로</text><text x="20" y="54" font-size="12" fill="#4B5563">각 단계에서 본 것이 다음에 무엇을 볼지 정했다. 1~4단계는 읽기만 했고, 상태를 바꾼 것은 5·6단계에서 원인을 확정한 직후뿐이다.</text><rect x="20" y="74" width="960" height="30" fill="#F3F4F6"/><text x="70" y="94" font-size="12" fill="#111827" font-weight="700">단계</text><text x="220" y="94" font-size="12" fill="#111827" font-weight="700">어떻게 봤나</text><text x="500" y="94" font-size="12" fill="#111827" font-weight="700">무엇을 알았나</text><text x="760" y="94" font-size="12" fill="#111827" font-weight="700">그래서 다음은</text><rect x="20" y="108" width="960" height="54" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/><circle cx="44" cy="135.0" r="12" fill="#374151"/><text x="44" y="139.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="70" y="139.0" font-size="12.5" fill="#111827" font-weight="700">파드 목록 보기</text><text x="220" y="131" font-size="11" fill="#4B5563">kubectl get pods -n</text><text x="220" y="147" font-size="11" fill="#4B5563">monitoring</text><text x="500" y="131" font-size="11" fill="#111827">store-gateway만 0/1 ·</text><text x="500" y="147" font-size="11" fill="#111827">AGE로 Mimir 재생성 시점(2026-04) 추정</text><text x="760" y="131" font-size="11" fill="#0C4A6E">겉으로는 대부분 Running → 안을 봐야</text><text x="760" y="147" font-size="11" fill="#0C4A6E">한다</text><path d="M44 147.0 V185.0" stroke="#D1D5DB" stroke-width="2"/><rect x="20" y="170" width="960" height="54" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/><circle cx="44" cy="197.0" r="12" fill="#374151"/><text x="44" y="201.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="70" y="201.0" font-size="12.5" fill="#111827" font-weight="700">읽기 전용 점검</text><text x="220" y="193" font-size="11" fill="#4B5563">점검 스크립트 1회</text><text x="220" y="209" font-size="11" fill="#4B5563">(get·logs·port-forward·조회 API)</text><text x="500" y="193" font-size="11" fill="#111827">수집 0 · 전송 지연 약 235일 · 알림</text><text x="500" y="209" font-size="11" fill="#111827">null · 로그 폐기</text><text x="760" y="193" font-size="11" fill="#0C4A6E">증상은 전부 &#x27;보내는 길&#x27;에 몰려 있다</text><path d="M44 209.0 V247.0" stroke="#D1D5DB" stroke-width="2"/><rect x="20" y="232" width="960" height="54" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/><circle cx="44" cy="259.0" r="12" fill="#374151"/><text x="44" y="263.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="70" y="263.0" font-size="12.5" fill="#111827" font-weight="700">이력 비교</text><text x="220" y="255" font-size="11" fill="#4B5563">helm history · helm get</text><text x="220" y="271" font-size="11" fill="#4B5563">values (리비전 비교)</text><text x="500" y="255" font-size="11" fill="#111827">4월에 업그레이드·롤백 반복 · 인증서</text><text x="500" y="271" font-size="11" fill="#111827">번호가 달라짐</text><text x="760" y="255" font-size="11" fill="#0C4A6E">누군가 고치려다 실패 → 단서는 인증서</text><path d="M44 271.0 V309.0" stroke="#D1D5DB" stroke-width="2"/><rect x="20" y="294" width="960" height="54" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/><circle cx="44" cy="321.0" r="12" fill="#374151"/><text x="44" y="325.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="70" y="325.0" font-size="12.5" fill="#111827" font-weight="700">클러스터별 확인</text><text x="220" y="317" font-size="11" fill="#4B5563">Prometheus CR remoteWrite</text><text x="220" y="333" font-size="11" fill="#4B5563">· 전송 로그</text><text x="500" y="317" font-size="11" fill="#111827">운영 클러스터 A: 보내는데 타임아웃 ·</text><text x="500" y="333" font-size="11" fill="#111827">운영 클러스터 B: 설정 없음</text><text x="760" y="317" font-size="11" fill="#0C4A6E">보내는 쪽 문제는 아니다 → 받는 쪽 입구</text><path d="M44 333.0 V371.0" stroke="#D1D5DB" stroke-width="2"/><rect x="20" y="356" width="960" height="54" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/><circle cx="44" cy="383.0" r="12" fill="#DC2626"/><text x="44" y="387.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text><text x="70" y="387.0" font-size="12.5" fill="#111827" font-weight="700">입구 확인</text><text x="220" y="379" font-size="11" fill="#4B5563">Ingress ADDRESS · nslookup</text><text x="220" y="395" font-size="11" fill="#4B5563">· 콘솔 인증서</text><text x="500" y="379" font-size="11" fill="#111827">ADDRESS 없음 · DNS는 소멸 LB</text><text x="500" y="395" font-size="11" fill="#111827">· 인증서 만료</text><text x="760" y="379" font-size="11" fill="#0C4A6E">① ② 확정 → 고쳐도 타임아웃 지속</text><path d="M44 395.0 V433.0" stroke="#D1D5DB" stroke-width="2"/><rect x="20" y="418" width="960" height="54" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/><circle cx="44" cy="445.0" r="12" fill="#DC2626"/><text x="44" y="449.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text><text x="70" y="449.0" font-size="12.5" fill="#111827" font-weight="700">구간 격리</text><text x="220" y="441" font-size="11" fill="#4B5563">외부 PC / 클러스터→ALB / 클러스터→외부</text><text x="220" y="457" font-size="11" fill="#4B5563">/ checkip</text><text x="500" y="441" font-size="11" fill="#111827">PC는 됨 · 클러스터만 막힘 · NAT는</text><text x="500" y="457" font-size="11" fill="#111827">정상</text><text x="760" y="441" font-size="11" fill="#0C4A6E">③ 입구 방화벽(NACL) → 8200만</text><text x="760" y="457" font-size="11" fill="#0C4A6E">허용 확인</text><path d="M44 457.0 V495.0" stroke="#D1D5DB" stroke-width="2"/><rect x="20" y="480" width="960" height="54" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/><circle cx="44" cy="507.0" r="12" fill="#166534"/><text x="44" y="511.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text><text x="70" y="511.0" font-size="12.5" fill="#111827" font-weight="700">복구 검증</text><text x="220" y="503" font-size="11" fill="#4B5563">전송 로그 · count(up) ·</text><text x="220" y="519" font-size="11" fill="#4B5563">Grafana</text><text x="500" y="503" font-size="11" fill="#111827">resharding 1→50 · 타깃 수</text><text x="500" y="519" font-size="11" fill="#111827">확인 · 그래프</text><text x="760" y="503" font-size="11" fill="#0C4A6E">복구 확인 → 이후 내부 경로 전환·연동</text></svg>
