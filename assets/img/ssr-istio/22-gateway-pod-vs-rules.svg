<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820" style="max-width:100%;height:auto" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a0F6E56" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0F6E56"/></marker><marker id="a185FA5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#185FA5"/></marker></defs><rect width="1180" height="820" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#2C2C2A" text-anchor="start">게이트웨이 헷갈리는 이름 정리 — "파드" 와 "규칙 리소스" 는 다른 것</text>
<text x="24" y="56" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">"게이트웨이" 라는 말이 세 가지를 가리킨다. 누가 만드는지도 다르다</text>
<rect x="30" y="90" width="300" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="180.0" y="130.0" font-size="14" font-weight="700" fill="#412402" text-anchor="middle">ingressgateway 파드 (Deployment)</text>
<rect x="345" y="90" width="330" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="360" y="120" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">실제로 트래픽을 받는 Envoy 프로세스</text>
<text x="360" y="142" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start">비유: 건물 정문의 안내데스크 직원</text>
<rect x="690" y="90" width="220" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="800" y="130" font-size="12" font-weight="700" fill="#185FA5" text-anchor="middle">Istio 설치(istio-addon)가 만든다</text>
<rect x="30" y="175" width="300" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="180.0" y="215.0" font-size="14" font-weight="700" fill="#04342C" text-anchor="middle">Gateway 리소스</text>
<rect x="345" y="175" width="330" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="360" y="205" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">그 파드에게 "어느 포트로 어떤 호스트를 받아라"</text>
<text x="360" y="227" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start">비유: 안내데스크에 붙인 "80번 창구 운영" 안내문</text>
<rect x="690" y="175" width="220" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="800" y="215" font-size="12" font-weight="700" fill="#185FA5" text-anchor="middle">앱 차트가 만든다</text>
<rect x="30" y="260" width="300" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="180.0" y="300.0" font-size="14" font-weight="700" fill="#04342C" text-anchor="middle">VirtualService 리소스</text>
<rect x="345" y="260" width="330" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="360" y="290" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">받은 요청을 "어느 Service 로 보내라"</text>
<text x="360" y="312" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start">비유: "이 방문객은 3층 front-end-next 로" 안내표</text>
<rect x="690" y="260" width="220" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="800" y="300" font-size="12" font-weight="700" fill="#185FA5" text-anchor="middle">앱 차트가 만든다</text>
<rect x="925" y="90" width="225" height="240" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="940" y="115" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="start">왜 나눠 놨나</text>
<text x="940" y="140" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">파드는 플랫폼(인프라)이</text>
<text x="940" y="161" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">한 번 띄워 두고,</text>
<text x="940" y="182" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start"></text>
<text x="940" y="203" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">규칙은 앱이 자기 것을</text>
<text x="940" y="224" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">자기 차트로 관리한다.</text>
<text x="940" y="245" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start"></text>
<text x="940" y="266" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">앱이 늘어도 파드는</text>
<text x="940" y="287" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">과목당 하나면 된다</text>
<rect x="30" y="350" width="1120" height="300" rx="12" fill="#E6F1FB" fill-opacity="0.45" stroke="#185FA5" stroke-width="1" stroke-dasharray="7 5"/>
<text x="42" y="370" font-size="13" font-weight="700" fill="#0C447C" text-anchor="start">요청이 지나는 순서 (mesh.enabled: true)</text>
<rect x="50" y="385" width="540" height="245" rx="12" fill="#FAEEDA" fill-opacity="0.45" stroke="#854F0B" stroke-width="1" stroke-dasharray="7 5"/>
<text x="62" y="405" font-size="13" font-weight="700" fill="#412402" text-anchor="start">namespace: istio-system</text>
<rect x="610" y="385" width="520" height="245" rx="12" fill="#E1F5EE" fill-opacity="0.45" stroke="#0F6E56" stroke-width="1" stroke-dasharray="7 5"/>
<text x="622" y="405" font-size="13" font-weight="700" fill="#04342C" text-anchor="start">namespace: test-lms</text>
<rect x="70" y="420" width="140" height="60" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="140.0" y="442" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">Ingress</text>
<text x="140.0" y="462" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">→ NCP ALB 생성</text>
<rect x="230" y="420" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="310.0" y="442" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">게이트웨이 Service</text>
<text x="310.0" y="462" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">NodePort</text>
<rect x="410" y="420" width="160" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="490.0" y="442" font-size="14" font-weight="700" fill="#412402" text-anchor="middle">ingressgateway</text>
<text x="490.0" y="462" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle">파드 (Envoy)</text>
<rect x="410" y="520" width="160" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" stroke-dasharray="6 4"/>
<text x="490.0" y="542" font-size="14" font-weight="700" fill="#04342C" text-anchor="middle">Gateway</text>
<text x="490.0" y="562" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">규칙: 80 포트 받기</text>
<rect x="630" y="420" width="170" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" stroke-dasharray="6 4"/>
<text x="715.0" y="442" font-size="14" font-weight="700" fill="#04342C" text-anchor="middle">VirtualService</text>
<text x="715.0" y="462" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">규칙: / → 앱</text>
<rect x="820" y="420" width="140" height="60" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="890.0" y="442" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">앱 Service</text>
<text x="890.0" y="462" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">front-end-next</text>
<rect x="975" y="420" width="140" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="1045.0" y="442" font-size="14" font-weight="700" fill="#173404" text-anchor="middle">앱 파드</text>
<text x="1045.0" y="462" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">사이드카 → nginx</text>
<path d="M210 450 L230 450" fill="none" stroke="#185FA5" stroke-width="2" marker-end="url(#a185FA5)"/>
<path d="M390 450 L410 450" fill="none" stroke="#185FA5" stroke-width="2" marker-end="url(#a185FA5)"/>
<path d="M570 450 L630 450" fill="none" stroke="#185FA5" stroke-width="2" marker-end="url(#a185FA5)"/>
<path d="M800 450 L820 450" fill="none" stroke="#185FA5" stroke-width="2" marker-end="url(#a185FA5)"/>
<path d="M960 450 L975 450" fill="none" stroke="#185FA5" stroke-width="2" marker-end="url(#a185FA5)"/>
<path d="M490 520 L490 480" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a0F6E56)"/>
<text x="500" y="505" font-size="11" font-weight="400" fill="#0F6E56" text-anchor="start">selector: istio=ingressgateway-test-lms</text>
<path d="M570 550 L715 550 L715 480" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a0F6E56)"/>
<text x="725" y="540" font-size="11" font-weight="400" fill="#0F6E56" text-anchor="start">gateways: istio-system/front-end-next-gw</text>
<text x="70" y="610" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start">실선 = 요청이 지나가는 길,  점선 = 규칙이 무엇에 붙는지</text>
<rect x="30" y="670" width="1120" height="135" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="45" y="695" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="start">Ingress 가 왜 istio-system 으로 옮겨 가나</text>
<text x="45" y="720" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· 쿠버네티스 Ingress 는 자기와 같은 네임스페이스의 Service 만 가리킬 수 있다. 게이트웨이 Service 가 istio-system 에 있으니 Ingress 도 거기 있어야 한다</text>
<text x="45" y="743" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· NCP 에서는 Ingress 하나 = ALB 하나다. test-lms 의 Ingress 가 지워지고 istio-system 에 새로 생기면 → 기존 ALB 삭제, 새 ALB 생성</text>
<text x="45" y="766" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start">· 그래서 입구 전환은 되돌리기 어렵고, 전환하는 동안 접속이 잠깐 끊긴다 (이번엔 약 1분, 공인 IP 는 재사용 설정으로 유지)</text>
<text x="45" y="789" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· mesh.enabled: false 면 Ingress 가 test-lms 에서 앱 Service 를 바로 가리킨다 (게이트웨이·Gateway·VS 없음)</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
