<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="1120" height="720" fill="#ffffff"/>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#111827">notice-agent 전체 아키텍처</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">2 vCPU · 4 GiB · 스왑 없음 · 클라우드 VM 1대 / 외부로 나가는 HTTPS만 사용</text>

  <!-- External: sources -->
  <rect x="40" y="130" width="210" height="76" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="145" y="160" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">GitLab Docs</text>
  <text x="145" y="182" font-size="12" fill="#065f46" text-anchor="middle">patch-releases.xml</text>
  <text x="145" y="198" font-size="12" fill="#065f46" text-anchor="middle">+ 패치 공지 페이지</text>

  <rect x="40" y="230" width="210" height="76" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="145" y="260" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">jenkins.io</text>
  <text x="145" y="282" font-size="12" fill="#065f46" text-anchor="middle">security/advisories/rss.xml</text>
  <text x="145" y="298" font-size="12" fill="#065f46" text-anchor="middle">+ 보안 권고 페이지</text>

  <rect x="40" y="560" width="210" height="96" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="145" y="586" font-size="13" font-weight="700" fill="#4b5563" text-anchor="middle">설치할 때 1회만 사용</text>
  <text x="145" y="610" font-size="12" fill="#4b5563" text-anchor="middle">Hugging Face (모델 원본)</text>
  <text x="145" y="630" font-size="12" fill="#4b5563" text-anchor="middle">ghcr.io (llama.cpp 이미지)</text>

  <!-- Server boundary -->
  <rect x="290" y="100" width="560" height="590" rx="14" fill="#fcfcfd" stroke="#111827" stroke-width="2"/>
  <text x="310" y="126" font-size="13" font-weight="700" fill="#111827">리눅스 서버 (2 vCPU · 4 GiB)</text>

  <!-- systemd -->
  <rect x="310" y="145" width="230" height="62" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="425" y="171" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">notice-agent.timer</text>
  <text x="425" y="192" font-size="12" fill="#4b5563" text-anchor="middle">30분마다 (+최대 2분 무작위)</text>

  <rect x="580" y="145" width="250" height="62" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="705" y="171" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">notice-agent.service</text>
  <text x="705" y="192" font-size="12" fill="#4b5563" text-anchor="middle">oneshot · Nice=10 · 최대 1시간</text>

  <line x1="540" y1="176" x2="576" y2="176" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="705" y1="207" x2="705" y2="243" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="714" y="230" font-size="11" fill="#6b7280">python3 agent.py</text>

  <!-- agent.py -->
  <rect x="310" y="246" width="520" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="570" y="276" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">agent.py  (오케스트레이터)</text>
  <text x="570" y="300" font-size="12" fill="#1e40af" text-anchor="middle">RSS 수집 → 새 공지 판별 → 원문 보안 표 추출 → CVE별 LLM 번역 · 검사 → 저장 → 알림</text>
  <text x="570" y="316" font-size="11" fill="#3b82f6" text-anchor="middle">Python 표준 라이브러리만 사용</text>

  <!-- row 3 -->
  <rect x="310" y="370" width="140" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="396" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">state.db</text>
  <text x="380" y="416" font-size="11" fill="#1e40af" text-anchor="middle">SQLite · 처리 이력</text>

  <rect x="470" y="370" width="150" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="545" y="396" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">out/*.md, *.json</text>
  <text x="545" y="416" font-size="11" fill="#1e40af" text-anchor="middle">요약 결과 파일</text>

  <rect x="640" y="370" width="190" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="735" y="396" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">jira-notify.py</text>
  <text x="735" y="416" font-size="11" fill="#1e40af" text-anchor="middle">이슈 · 에픽 · 스프린트</text>

  <line x1="380" y1="326" x2="380" y2="366" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <line x1="545" y1="326" x2="545" y2="366" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="770" y1="326" x2="770" y2="366" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="778" y="352" font-size="11" fill="#6b7280">subprocess</text>
  <line x1="620" y1="401" x2="636" y2="401" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Docker area -->
  <rect x="310" y="458" width="520" height="122" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 4"/>
  <rect x="330" y="478" width="300" height="66" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="480" y="504" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle">llama.cpp server 컨테이너</text>
  <text x="480" y="526" font-size="11" fill="#92400e" text-anchor="middle">127.0.0.1:8080 · 메모리 2400m · CPU 1.5</text>

  <rect x="650" y="478" width="160" height="66" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="730" y="504" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">Kanana 1.5 2.1B</text>
  <text x="730" y="526" font-size="11" fill="#92400e" text-anchor="middle">Q4_K_M GGUF · 1.5GB</text>
  <line x1="650" y1="511" x2="634" y2="511" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="640" y="562" font-size="11" fill="#92400e">읽기 전용 마운트</text>
  <text x="322" y="568" font-size="11" fill="#92400e">Docker · 새 공지가 있을 때만 기동하고 끝나면 제거</text>

  <line x1="460" y1="326" x2="460" y2="474" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="466" y="450" font-size="11" fill="#6b7280">docker run → HTTP 요약 요청</text>

  <!-- bottom row -->
  <rect x="310" y="600" width="250" height="70" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="435" y="627" font-size="13" font-weight="700" fill="#831843" text-anchor="middle">/etc/notice-agent.env</text>
  <text x="435" y="647" font-size="11" fill="#9d174d" text-anchor="middle">설정 · Jira 토큰 (root 전용 600)</text>
  <text x="435" y="662" font-size="11" fill="#9d174d" text-anchor="middle">모든 실행이 이 파일을 읽는다</text>

  <rect x="580" y="600" width="250" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="705" y="627" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">기존 상주 에이전트</text>
  <text x="705" y="647" font-size="11" fill="#4b5563" text-anchor="middle">보안 · 백업 · 로그 · 모니터링</text>
  <text x="705" y="662" font-size="11" fill="#4b5563" text-anchor="middle">(건드리지 않음)</text>

  <!-- External: Jira -->
  <rect x="890" y="345" width="200" height="112" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="990" y="374" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">Jira Cloud</text>
  <text x="990" y="396" font-size="12" fill="#065f46" text-anchor="middle">REST API v2</text>
  <text x="990" y="414" font-size="12" fill="#065f46" text-anchor="middle">Agile API 1.0</text>
  <text x="990" y="438" font-size="11" fill="#047857" text-anchor="middle">프로젝트 · 에픽 · 스프린트</text>
  <line x1="830" y1="401" x2="886" y2="401" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- arrows from sources -->
  <path d="M250,168 L275,168 L275,270 L306,270" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M250,268 L266,268 L266,300 L306,300" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="150" y="330" font-size="11" fill="#6b7280" text-anchor="middle">HTTPS GET (RSS · 페이지)</text>

  <path d="M250,608 L272,608 L272,511 L326,511" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arg)"/>
</svg>
