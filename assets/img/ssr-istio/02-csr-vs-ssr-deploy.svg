<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" style="max-width:100%;height:auto" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a5F5E5A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#5F5E5A"/></marker></defs><rect width="1100" height="600" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#2C2C2A" text-anchor="start">AS-IS CSR 배포 vs TO-BE SSR 배포 — 무엇이 근본적으로 바뀌나</text>
<rect x="20" y="60" width="520" height="520" rx="12" fill="#FAECE7" fill-opacity="0.45" stroke="#993C1D" stroke-width="1" stroke-dasharray="7 5"/>
<text x="32" y="80" font-size="13" font-weight="700" fill="#4A1B0C" text-anchor="start">AS-IS — CSR (Vue): 파일을 파드에 밀어 넣는다</text>
<rect x="40" y="95" width="480" height="55" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="280.0" y="117" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">젠킨스 fe-service 잡</text>
<text x="280.0" y="137" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">npm run build:$buildenv → dist/ 정적 파일</text>
<path d="M280 150 L280 175" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a5F5E5A)"/>
<rect x="40" y="175" width="480" height="55" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="280.0" y="197" font-size="14" font-weight="700" fill="#4A1B0C" text-anchor="middle">kubectl cp 로 nginx 파드에 복사</text>
<text x="280.0" y="217" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle">+ env.js 런타임 생성 · nginx -s reload</text>
<path d="M280 230 L280 255" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a5F5E5A)"/>
<rect x="40" y="255" width="480" height="200" rx="12" fill="#F1EFE8" fill-opacity="0.45" stroke="#5F5E5A" stroke-width="1"/>
<text x="52" y="275" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="start">nginx 파드 (이미지는 그대로)</text>
<rect x="60" y="290" width="210" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="165.0" y="312" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">nginx</text>
<text x="165.0" y="332" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">nginx 이미지 (설정만 얹음)</text>
<rect x="290" y="290" width="210" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="395.0" y="312" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">PVC (NAS)</text>
<text x="395.0" y="332" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">정적 파일 /usr/share/nginx/html</text>
<text x="60" y="395" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start">배포된 버전이 이미지가 아니라 파드 안 파일에 있다</text>
<text x="60" y="415" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start">→ Git 에 남지 않아 ArgoCD 같은 선언형 도구와 안 맞는다</text>
<text x="60" y="435" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start">→ "지금 뭐가 떠 있나"를 클러스터에서 알 수 없다</text>
<text x="40" y="490" font-size="13" font-weight="700" fill="#4A1B0C" text-anchor="start">배포 단위: 파일</text>
<text x="40" y="512" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">롤백: 이전 빌드 결과를 다시 cp</text>
<text x="40" y="532" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">ConfigMap(nginx.conf): 젠킨스가 sed 치환 후 kubectl apply</text>
<text x="40" y="552" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">이미지 빌드에 앱 소스가 필요 없다 (Dockerfile 이 COPY 안 함)</text>
<rect x="560" y="60" width="520" height="520" rx="12" fill="#E1F5EE" fill-opacity="0.45" stroke="#0F6E56" stroke-width="1" stroke-dasharray="7 5"/>
<text x="572" y="80" font-size="13" font-weight="700" fill="#04342C" text-anchor="start">TO-BE — SSR (Next.js): 이미지를 바꿔 끼운다</text>
<rect x="580" y="95" width="480" height="55" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="820.0" y="117" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">젠킨스 lms-ssr-poc-svc 잡</text>
<text x="820.0" y="137" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">소스 체크아웃 → Kaniko 로 이미지 빌드 → NCR 푸시</text>
<path d="M820 150 L820 175" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a5F5E5A)"/>
<rect x="580" y="175" width="480" height="55" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="820.0" y="197" font-size="14" font-weight="700" fill="#04342C" text-anchor="middle">Git 에 이미지 태그 커밋 (yq)</text>
<text x="820.0" y="217" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">values-poc-image.yaml · ssr.image.tag</text>
<path d="M820 230 L820 255" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a5F5E5A)"/>
<rect x="580" y="255" width="480" height="200" rx="12" fill="#F1EFE8" fill-opacity="0.45" stroke="#5F5E5A" stroke-width="1"/>
<text x="592" y="275" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="start">ArgoCD 가 새 파드로 교체</text>
<rect x="600" y="290" width="140" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="670.0" y="312" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">nginx</text>
<text x="670.0" y="332" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">nginx:stable-alpine</text>
<rect x="750" y="290" width="140" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="820.0" y="312" font-size="14" font-weight="700" fill="#26215C" text-anchor="middle">ssr</text>
<text x="820.0" y="332" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle">Node 런타임 이미지</text>
<rect x="900" y="290" width="140" height="70" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="970.0" y="312" font-size="14" font-weight="700" fill="#173404" text-anchor="middle">istio-proxy</text>
<text x="970.0" y="332" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">주입된 사이드카</text>
<text x="600" y="395" font-size="12" font-weight="400" fill="#1D9E75" text-anchor="start">배포된 버전 = 이미지 태그 = Git 커밋</text>
<text x="600" y="415" font-size="12" font-weight="400" fill="#1D9E75" text-anchor="start">→ Git 이 곧 배포 이력. ArgoCD 로 관리 가능</text>
<text x="600" y="435" font-size="12" font-weight="400" fill="#1D9E75" text-anchor="start">→ PVC 불필요 (서버가 이미지 안에 있다)</text>
<text x="580" y="490" font-size="13" font-weight="700" fill="#04342C" text-anchor="start">배포 단위: 이미지</text>
<text x="580" y="512" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">롤백: Git revert 또는 이전 태그로 sync</text>
<text x="580" y="532" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">ConfigMap(nginx.conf): 헬름 템플릿으로 Git 관리</text>
<text x="580" y="552" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">이미지 빌드에 앱 소스가 필요하다 (Dockerfile 이 COPY 함)</text></svg>
