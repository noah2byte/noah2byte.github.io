<svg width="1020" height="520" viewBox="0 0 1020 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="1020" height="520" fill="#fbfcfd"/>

  <text x="510" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">GitOps 전환 — 레포 구조</text>
  <text x="510" y="62" text-anchor="middle" font-size="13" fill="#6e7781">역할별로 세 개의 Git 레포로 나눴다</text>

  <!-- Card 1 -->
  <g>
    <rect x="30" y="94" width="300" height="384" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="30" y="94" width="300" height="58" rx="10" fill="#eef2ff"/>
    <rect x="30" y="128" width="300" height="24" fill="#eef2ff"/>
    <text x="180" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#3b3fa8">ArgoCD 설치용 레포</text>
    <text x="180" y="142" text-anchor="middle" font-size="11.5" fill="#5a5fc7">ArgoCD 자신의 설정</text>
    <rect x="30" y="152" width="300" height="1" fill="#d0d7de"/>

    <text x="54" y="184" font-size="13" font-weight="700" fill="#24292f">argo-cd/</text>
    <text x="66" y="204" font-size="11.5" fill="#6e7781">설치 차트 (LB, NCP ALB)</text>

    <text x="54" y="242" font-size="13" font-weight="700" fill="#24292f">addon/projects/</text>
    <text x="66" y="262" font-size="11.5" fill="#6e7781">AppProject 정의</text>

    <text x="54" y="300" font-size="13" font-weight="700" fill="#24292f">addon/applications/</text>
    <text x="66" y="320" font-size="11.5" fill="#6e7781">Application 정의</text>
    <text x="66" y="338" font-size="11.5" fill="#6e7781">(서비스별 배포 대상)</text>

    <rect x="50" y="410" width="240" height="46" rx="6" fill="#f6f8fa"/>
    <text x="170" y="438" text-anchor="middle" font-size="11" fill="#57606a">ArgoCD를 어떻게 운영할지</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="360" y="94" width="300" height="384" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="360" y="94" width="300" height="58" rx="10" fill="#eafaf1"/>
    <rect x="360" y="128" width="300" height="24" fill="#eafaf1"/>
    <text x="510" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">인프라 헬름 차트 레포</text>
    <text x="510" y="142" text-anchor="middle" font-size="11.5" fill="#2f9e5c">실제 서비스 배포 설정</text>
    <rect x="360" y="152" width="300" height="1" fill="#d0d7de"/>

    <text x="384" y="184" font-size="13" font-weight="700" fill="#24292f">services/helm-n/</text>
    <text x="396" y="204" font-size="11.5" fill="#6e7781">aidt-lm-service/</text>

    <text x="384" y="240" font-size="12" fill="#24292f">values-stg-*.yaml (신규)</text>
    <text x="384" y="260" font-size="12" fill="#24292f">values-prod-*.yaml (신규)</text>

    <text x="384" y="298" font-size="13" font-weight="700" fill="#24292f">templates/</text>
    <text x="396" y="318" font-size="11.5" fill="#24292f">Namespace.yml (신규)</text>
    <text x="396" y="336" font-size="11.5" fill="#6e7781">Deployment.yml 등 (기존)</text>

    <rect x="380" y="410" width="240" height="46" rx="6" fill="#f6f8fa"/>
    <text x="500" y="438" text-anchor="middle" font-size="11" fill="#57606a">진짜 원본은 여기 그대로</text>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="690" y="94" width="300" height="384" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="690" y="94" width="300" height="58" rx="10" fill="#fff4e5"/>
    <rect x="690" y="128" width="300" height="24" fill="#fff4e5"/>
    <text x="840" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#9a5b13">GitOps 학습·PoC 레포</text>
    <text x="840" y="142" text-anchor="middle" font-size="11.5" fill="#b8761c">개념 검증 전용</text>
    <rect x="690" y="152" width="300" height="1" fill="#d0d7de"/>

    <text x="714" y="184" font-size="13" font-weight="700" fill="#24292f">react-app/</text>
    <text x="714" y="212" font-size="13" font-weight="700" fill="#24292f">springboot-app/</text>

    <text x="714" y="250" font-size="11.5" fill="#6e7781">개념 검증용 샘플 앱</text>
    <text x="714" y="270" font-size="11.5" fill="#6e7781">실제 서비스 아님</text>

    <rect x="710" y="410" width="240" height="46" rx="6" fill="#f6f8fa"/>
    <text x="830" y="438" text-anchor="middle" font-size="11" fill="#57606a">실제 서비스 전 연습장</text>
  </g>

  <text x="510" y="500" text-anchor="middle" font-size="12" fill="#8b949e">관심사가 다르면 레포도 나눈다</text>
</svg>
