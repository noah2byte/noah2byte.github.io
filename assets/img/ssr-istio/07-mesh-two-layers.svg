<text x="820.0" y="282" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle">Gateway + VirtualService</text>
<path d="M820 295 L820 320" fill="none" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#a1D9E75)"/>
<text x="830" y="312" font-size="12" font-weight="400" fill="#1D9E75" text-anchor="start">mTLS</text>
<rect x="580" y="320" width="480" height="110" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="595" y="342" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="start">Pod (3/3)</text>
<rect x="595" y="355" width="140" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="665.0" y="390.0" font-size="13" font-weight="700" fill="#173404" text-anchor="middle">istio-proxy</text>
<rect x="750" y="355" width="140" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="820.0" y="377" font-size="13" font-weight="700" fill="#26215C" text-anchor="middle">nginx</text>
<text x="820.0" y="397" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle">:80</text>
<rect x="905" y="355" width="140" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="975.0" y="377" font-size="13" font-weight="700" fill="#26215C" text-anchor="middle">next</text>
<text x="975.0" y="397" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle">:3000</text>
<path d="M735 385 L750 385" fill="none" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#a1D9E75)"/>
<path d="M890 385 L905 385" fill="none" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#a1D9E75)"/>
<text x="580" y="470" font-size="12" font-weight="400" fill="#412402" text-anchor="start">켜는 법: values 의 mesh.enabled: true + 하위 값 채우기</text>
<text x="580" y="490" font-size="12" font-weight="400" fill="#412402" text-anchor="start">         + test-lms AppProject destinations 에 istio-system</text>
<text x="580" y="512" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">되는 것: 외부 트래픽 라우팅(가중치·헤더 분기), STRICT 가능</text>
<text x="20" y="560" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">mesh.enabled 는 이름과 달리 "mesh 전체 스위치"가 아니다. 이 차트에선 입구만 바꾼다. 사이드카는 네임스페이스 라벨이 결정한다.</text>
<text x="20" y="580" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">10/8 오후부터 라벨도 차트(Namespace.yml)가 mesh.enabled 에 묶어 관리한다 → 지금은 스위치 하나로 두 층이 함께 켜진다.</text></svg>
