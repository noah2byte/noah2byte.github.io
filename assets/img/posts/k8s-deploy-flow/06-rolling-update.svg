<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill:#1e293b; }
    .title { font-size:22px; font-weight:700; }
    .sub { font-size:13px; fill:#475569; }
    .ct { font-size:14px; font-weight:700; }
    .cd { font-size:12px; fill:#475569; }
    .p { font-size:13px; font-weight:700; }
    .ps { font-size:11px; fill:#475569; }
    .ep { font-size:12px; font-weight:700; }
    .t { font-size:13px; }
    .small { font-size:12px; fill:#475569; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="30" y="40" class="title">롤링 업데이트: maxSurge 1 / maxUnavailable 0 (api-backend, 파드 2개)</text>
  <text x="30" y="64" class="sub">새 파드가 Ready 된 뒤에야 옛 파드를 하나 내린다 → Ready 파드가 2개 밑으로 내려가지 않는다</text>

  <!-- column template: x, width 180 -->
  <!-- t0 -->
  <text x="110" y="100" text-anchor="middle" class="ct">t0 시작</text>
  <text x="110" y="118" text-anchor="middle" class="cd">옛 파드 2개</text>
  <rect x="40" y="132" width="140" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="110" y="152" text-anchor="middle" class="p">A (옛)</text><text x="110" y="168" text-anchor="middle" class="ps">Ready</text>
  <rect x="40" y="184" width="140" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="110" y="204" text-anchor="middle" class="p">B (옛)</text><text x="110" y="220" text-anchor="middle" class="ps">Ready</text>
  <rect x="40" y="300" width="140" height="30" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/><text x="110" y="320" text-anchor="middle" class="ep">EP: A, B</text>

  <line x1="190" y1="200" x2="222" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- t1 -->
  <text x="300" y="100" text-anchor="middle" class="ct">t1 새 파드 C 생성</text>
  <text x="300" y="118" text-anchor="middle" class="cd">maxSurge 1 → 잠시 3개</text>
  <rect x="230" y="132" width="140" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="300" y="152" text-anchor="middle" class="p">A (옛)</text><text x="300" y="168" text-anchor="middle" class="ps">Ready</text>
  <rect x="230" y="184" width="140" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="300" y="204" text-anchor="middle" class="p">B (옛)</text><text x="300" y="220" text-anchor="middle" class="ps">Ready</text>
  <rect x="230" y="236" width="140" height="44" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-dasharray="5 4"/><text x="300" y="256" text-anchor="middle" class="p">C (새)</text><text x="300" y="272" text-anchor="middle" class="ps">init·기동 중</text>
  <rect x="230" y="300" width="140" height="30" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/><text x="300" y="320" text-anchor="middle" class="ep">EP: A, B</text>

  <line x1="380" y1="200" x2="412" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- t2 -->
  <text x="490" y="100" text-anchor="middle" class="ct">t2 C Ready → A 종료</text>
  <text x="490" y="118" text-anchor="middle" class="cd">C를 EP에 추가, A는 EP에서 제거</text>
  <rect x="420" y="132" width="140" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="5 4"/><text x="490" y="152" text-anchor="middle" class="p" style="fill:#b91c1c">A (옛)</text><text x="490" y="168" text-anchor="middle" class="ps">종료 중 (SIGTERM)</text>
  <rect x="420" y="184" width="140" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="490" y="204" text-anchor="middle" class="p">B (옛)</text><text x="490" y="220" text-anchor="middle" class="ps">Ready</text>
  <rect x="420" y="236" width="140" height="44" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="490" y="256" text-anchor="middle" class="p">C (새)</text><text x="490" y="272" text-anchor="middle" class="ps">Ready</text>
  <rect x="420" y="300" width="140" height="30" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/><text x="490" y="320" text-anchor="middle" class="ep">EP: B, C</text>

  <line x1="570" y1="200" x2="602" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- t3 -->
  <text x="680" y="100" text-anchor="middle" class="ct">t3 새 파드 D 생성</text>
  <text x="680" y="118" text-anchor="middle" class="cd">다시 잠시 3개</text>
  <rect x="610" y="184" width="140" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="680" y="204" text-anchor="middle" class="p">B (옛)</text><text x="680" y="220" text-anchor="middle" class="ps">Ready</text>
  <rect x="610" y="236" width="140" height="44" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="680" y="256" text-anchor="middle" class="p">C (새)</text><text x="680" y="272" text-anchor="middle" class="ps">Ready</text>
  <rect x="610" y="132" width="140" height="44" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-dasharray="5 4"/><text x="680" y="152" text-anchor="middle" class="p">D (새)</text><text x="680" y="168" text-anchor="middle" class="ps">init·기동 중</text>
  <rect x="610" y="300" width="140" height="30" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/><text x="680" y="320" text-anchor="middle" class="ep">EP: B, C</text>

  <line x1="760" y1="200" x2="792" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- t4 -->
  <text x="880" y="100" text-anchor="middle" class="ct">t4 완료</text>
  <text x="880" y="118" text-anchor="middle" class="cd">D Ready → B 종료</text>
  <rect x="810" y="132" width="140" height="44" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="880" y="152" text-anchor="middle" class="p">D (새)</text><text x="880" y="168" text-anchor="middle" class="ps">Ready</text>
  <rect x="810" y="236" width="140" height="44" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="880" y="256" text-anchor="middle" class="p">C (새)</text><text x="880" y="272" text-anchor="middle" class="ps">Ready</text>
  <rect x="810" y="300" width="140" height="30" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/><text x="880" y="320" text-anchor="middle" class="ep">EP: C, D</text>

  <!-- notes -->
  <rect x="30" y="352" width="940" height="102" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="378" class="t"><tspan font-weight="700">maxUnavailable 0:</tspan> 교체 중에도 Ready 파드는 항상 2개 이상 → 용량이 줄지 않는다 (대신 교체가 느리다)</text>
  <text x="50" y="402" class="t"><tspan font-weight="700">maxSurge 1:</tspan> 원래 수보다 1개까지 더 띄울 수 있다 → 노드에 파드 1개 분의 여유가 있어야 한다</text>
  <text x="50" y="426" class="t"><tspan font-weight="700">종료 순간 주의:</tspan> 옛 파드는 EndpointSlice 제거와 SIGTERM이 <tspan font-weight="700">동시에</tspan> 시작된다. 전파 전에 앱이 먼저 죽으면</text>
  <text x="50" y="446" class="t">요청이 실패할 수 있어 preStop 대기·graceful shutdown이 필요하다</text>
</svg>
