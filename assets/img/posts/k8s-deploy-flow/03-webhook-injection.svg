<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill:#1e293b; }
    .title { font-size:22px; font-weight:700; }
    .sub { font-size:13px; fill:#475569; }
    .h { font-size:15px; font-weight:700; }
    .t { font-size:13px; }
    .code { font-family: 'DejaVu Sans Mono','Menlo','Consolas','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',monospace; font-size:12px; }
    .small { font-size:12px; fill:#475569; }
    .lab { font-size:12px; font-weight:700; fill:#475569; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="30" y="40" class="title">웹훅 두 개는 "보는 것"이 다르다</text>
  <text x="30" y="64" class="sub">Helm 차트에는 앱 컨테이너 하나뿐인데, 실제 파드에는 컨테이너가 다섯 개인 이유</text>

  <!-- LEFT: original spec -->
  <rect x="30" y="90" width="270" height="330" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="118" class="h">① Helm 차트가 만든 파드 스펙</text>
  <text x="50" y="148" class="lab">containers</text>
  <rect x="50" y="158" width="230" height="38" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="165" y="182" text-anchor="middle" class="t">api-backend (앱)</text>

  <text x="50" y="232" class="lab">파드 어노테이션 (Vault가 봄)</text>
  <rect x="50" y="242" width="230" height="44" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="60" y="262" class="code">vault.hashicorp.com/</text>
  <text x="60" y="278" class="code">  agent-inject: "true"</text>

  <text x="50" y="320" class="lab">네임스페이스 app 라벨 (Istio가 봄)</text>
  <rect x="50" y="330" width="230" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="60" y="350" class="code">istio-injection=enabled *</text>
  <text x="60" y="366" class="small">또는 istio.io/rev=... 방식</text>
  <text x="50" y="402" class="small">* 실제 라벨은 k get ns app --show-labels</text>

  <!-- MIDDLE: webhooks -->
  <rect x="360" y="90" width="280" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="118" class="h" style="fill:#1d4ed8">② Istio 웹훅</text>
  <text x="380" y="140" class="code">istio-sidecar-injector</text>
  <text x="380" y="166" class="t"><tspan font-weight="700">트리거:</tspan> 네임스페이스 라벨</text>
  <text x="380" y="190" class="t"><tspan font-weight="700">넣는 것:</tspan> istio-init (init)</text>
  <text x="440" y="212" class="t">+ istio-proxy (사이드카)</text>

  <rect x="360" y="270" width="280" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="298" class="h" style="fill:#b45309">③ Vault 웹훅</text>
  <text x="380" y="320" class="code">vault-agent-injector-cfg</text>
  <text x="380" y="346" class="t"><tspan font-weight="700">트리거:</tspan> 파드 어노테이션</text>
  <text x="380" y="370" class="t"><tspan font-weight="700">넣는 것:</tspan> vault-agent-init (init)</text>
  <text x="440" y="392" class="t">+ vault-agent (사이드카)</text>

  <!-- arrows left->middle -->
  <path d="M280,352 C320,352 320,165 356,165" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M280,264 C320,264 320,345 356,345" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr)"/>

  <!-- RIGHT: actual pod -->
  <rect x="700" y="90" width="270" height="330" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="720" y="118" class="h">④ 실제로 생성된 파드</text>
  <text x="720" y="148" class="lab">initContainers (순서대로)</text>
  <rect x="720" y="158" width="230" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="835" y="180" text-anchor="middle" class="t">1. istio-init</text>
  <rect x="720" y="198" width="230" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="835" y="220" text-anchor="middle" class="t">2. vault-agent-init</text>

  <text x="720" y="262" class="lab">containers (함께 실행)</text>
  <rect x="720" y="272" width="230" height="34" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="835" y="294" text-anchor="middle" class="t">api-backend (앱)</text>
  <rect x="720" y="312" width="230" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="835" y="334" text-anchor="middle" class="t">istio-proxy</text>
  <rect x="720" y="352" width="230" height="34" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="835" y="374" text-anchor="middle" class="t">vault-agent</text>

  <!-- arrows middle->right -->
  <line x1="640" y1="165" x2="696" y2="165" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="640" y1="345" x2="696" y2="345" stroke="#d97706" stroke-width="2" marker-end="url(#arr)"/>

  <!-- note -->
  <rect x="30" y="444" width="940" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="470" class="t"><tspan font-weight="700">언제?</tspan> ReplicaSet 컨트롤러가 파드 생성을 요청하면, API 서버가 <tspan font-weight="700">파드를 저장하기 직전</tspan>에 등록된 mutating 웹훅을 호출한다.</text>
  <text x="50" y="494" class="t"><tspan font-weight="700">처음에 틀린 설명:</tspan> "네임스페이스 라벨을 보고 istio-init과 vault-agent-init을 넣는다" (X) → 라벨은 Istio만, Vault는 파드 어노테이션 (○)</text>
  <text x="50" y="518" class="t"><tspan font-weight="700">그리고</tspan> 웹훅은 init 컨테이너만이 아니라 <tspan font-weight="700">사이드카까지</tspan> 함께 넣는다. 웹훅이 죽으면 파드 생성 자체가 실패할 수 있다.</text>
</svg>
