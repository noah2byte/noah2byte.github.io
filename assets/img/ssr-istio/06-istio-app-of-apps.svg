<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="830" viewBox="0 0 1100 830" style="max-width:100%;height:auto" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a5F5E5A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#5F5E5A"/></marker><marker id="a185FA5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#185FA5"/></marker><marker id="a888780" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#888780"/></marker></defs><rect width="1100" height="830" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#2C2C2A" text-anchor="start">Istio 설치 구조 — App of Apps (istio-addon 래퍼 차트)</text>
<rect x="20" y="60" width="1060" height="95" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="40" y="85" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="start">사람이 관리하는 곳: oss/argocd-10.1.4/addon/istio/values.yaml</text>
<text x="40" y="108" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">version: 1.23.2        ← 버전 업그레이드 = 이 한 줄 (base·istiod·gateway 세 차트가 함께 따라온다)</text>
<text x="40" y="126" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">revision: ""           ← 카나리 업그레이드 때만 채운다 (istiod-1-24 가 기존 istiod 와 나란히 뜬다)</text>
<text x="40" y="144" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">gateways: [test-lms]   ← 과목 추가 = 목록에 한 줄 (ingressgateway-&lt;name&gt; 이 생긴다)</text>
