<rect x="20" y="545" width="1060" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="550.0" y="567" font-size="14" font-weight="700" fill="#04342C" text-anchor="middle">Istio 공식 헬름 저장소 → istio-system 네임스페이스에 실제 설치</text>
<text x="550.0" y="587" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">istio-release.storage.googleapis.com/charts (AppProject infra 의 sourceRepos 에 등록 필요)</text>
<rect x="20" y="625" width="520" height="185" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="40" y="650" font-size="14" font-weight="700" fill="#412402" text-anchor="start">권한 — AppProject infra (새로 만듦)</text>
<text x="40" y="675" font-size="12" font-weight="400" fill="#854F0B" text-anchor="start">destinations: argocd, istio-system</text>
<text x="40" y="695" font-size="12" font-weight="400" fill="#854F0B" text-anchor="start">clusterResourceWhitelist: CRD, Mutating/Validating Webhook,</text>
<text x="40" y="713" font-size="12" font-weight="400" fill="#854F0B" text-anchor="start">   ClusterRole, ClusterRoleBinding, Namespace(istio-system)</text>
<text x="40" y="738" font-size="12" font-weight="700" fill="#412402" text-anchor="start">왜 test-lms 프로젝트가 아닌가</text>
<text x="40" y="758" font-size="12" font-weight="400" fill="#854F0B" text-anchor="start">앱 프로젝트에 클러스터 권한을 열면 그 안의 모든 앱이</text>
<text x="40" y="776" font-size="12" font-weight="400" fill="#854F0B" text-anchor="start">CRD·ClusterRole 을 만들 수 있게 된다. 인프라와 앱은</text>
<text x="40" y="794" font-size="12" font-weight="400" fill="#854F0B" text-anchor="start">영향 범위가 달라 프로젝트를 나눴다</text>
<rect x="560" y="625" width="520" height="185" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="580" y="650" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="start">기존 운영 방식과 비교</text>
<text x="580" y="675" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">기존: istioctl install -f IstioOperator.yml</text>
<text x="580" y="693" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">      + build_operator.sh 가 과목 목록을 돌며 yaml 생성</text>
<text x="580" y="711" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start">      → 목록이 스크립트에 하드코딩, Git 이력 없음, 사람이 실행</text>
<text x="580" y="736" font-size="12" font-weight="400" fill="#1D9E75" text-anchor="start">신규: 목록은 values, 찍어내기는 헬름 range, 적용은 ArgoCD</text>
<text x="580" y="754" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">계승: 과목마다 게이트웨이 하나 · 이름/라벨 규칙 · NodePort 포트</text>
<text x="580" y="779" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">계기: 과거 nginx 재배포 때 게이트웨이 미생성으로 503 경험</text>
<text x="580" y="797" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">      → 게이트웨이도 선언적으로 관리되면 빠질 일이 없다</text></svg>
