<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" style="max-width:100%;height:auto" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a185FA5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#185FA5"/></marker><marker id="a0F6E56" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0F6E56"/></marker><marker id="a3B6D11" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3B6D11"/></marker><marker id="a534AB7" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#534AB7"/></marker><marker id="a5F5E5A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#5F5E5A"/></marker></defs><rect width="1180" height="800" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#2C2C2A" text-anchor="start">사이드카는 어떻게 들어가나 — 웹훅 · caBundle · istio-init</text>
<text x="24" y="56" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">파드를 만드는 "순간" 에 istiod 가 끼어들어 파드 정의를 고친다. 그래서 이미 떠 있는 파드에는 안 들어가고 재시작이 필요하다</text>
<rect x="30" y="90" width="200" height="90" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="130.0" y="112" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">① 파드 생성 요청</text>
<text x="130.0" y="132" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">Deployment 재시작 등</text>
<text x="130.0" y="150" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">컨테이너: nginx, ssr</text>
<rect x="300" y="90" width="240" height="90" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="420.0" y="112" font-size="14" font-weight="700" fill="#0C447C" text-anchor="middle">② 쿠버네티스 API 서버</text>
<text x="420.0" y="132" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">만들기 직전에 묻는다</text>
<text x="420.0" y="150" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">"이 파드, 손볼 거 있어?"</text>
<rect x="620" y="90" width="240" height="90" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="740.0" y="112" font-size="14" font-weight="700" fill="#04342C" text-anchor="middle">③ istiod (웹훅 서버)</text>
<text x="740.0" y="132" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">네임스페이스 라벨 확인</text>
<text x="740.0" y="150" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">istio-injection=enabled 면</text>
<text x="740.0" y="167" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">"사이드카 넣어" 라고 답한다</text>
<rect x="930" y="90" width="220" height="90" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="1040.0" y="112" font-size="14" font-weight="700" fill="#173404" text-anchor="middle">④ 고쳐진 파드 생성</text>
<text x="1040.0" y="132" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">istio-init + istio-proxy</text>
<text x="1040.0" y="149" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">+ nginx + ssr</text>
<path d="M230 135 L300 135" fill="none" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#a5F5E5A)"/>
<path d="M540 125 L620 125" fill="none" stroke="#185FA5" stroke-width="1.8" marker-end="url(#a185FA5)"/>
<path d="M620 150 L540 150" fill="none" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#a0F6E56)"/>
<text x="580" y="117" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle">HTTPS 로 질문</text>
<text x="580" y="168" font-size="11" font-weight="400" fill="#0F6E56" text-anchor="middle">수정안</text>
<path d="M540 170 L560 200 L930 200 L1040 180" fill="none" stroke="#3B6D11" stroke-width="1.8" marker-end="url(#a3B6D11)"/>
<rect x="30" y="230" width="540" height="260" rx="12" fill="#FAEEDA" fill-opacity="0.45" stroke="#854F0B" stroke-width="1" stroke-dasharray="7 5"/>
<text x="42" y="250" font-size="13" font-weight="700" fill="#412402" text-anchor="start">MutatingWebhookConfiguration — "누구에게 물어볼지" 적힌 설정</text>
<rect x="50" y="265" width="500" height="135" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="65" y="290" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">webhooks:</text>
<text x="65" y="309" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">- name: sidecar-injector.istio.io</text>
<text x="65" y="328" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">  clientConfig:</text>
<text x="65" y="347" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">    service: istiod.istio-system:443   ← 여기로 물어본다</text>
<text x="65" y="366" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start">    caBundle: &lt;istiod 인증서&gt;          ← 이 인증서로 상대를 믿는다</text>
<text x="65" y="385" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">  namespaceSelector: istio-injection=enabled</text>
<text x="50" y="425" font-size="12" font-weight="700" fill="#A32D2D" text-anchor="start">caBundle 은 istiod 가 뜬 뒤 자기 인증서로 직접 채운다</text>
<text x="50" y="447" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">→ Git(헬름 차트)에는 빈칸, 클러스터에는 인증서. 영원히 다르다</text>
<text x="50" y="469" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">→ 틀린 값이 아니라 비교 대상이 아닌 칸 → ArgoCD ignoreDifferences</text>
<rect x="600" y="230" width="550" height="260" rx="12" fill="#EAF3DE" fill-opacity="0.45" stroke="#3B6D11" stroke-width="1" stroke-dasharray="7 5"/>
<text x="612" y="250" font-size="13" font-weight="700" fill="#173404" text-anchor="start">고쳐진 파드 안 — istio-init 이 길을 바꿔 놓는다</text>
<rect x="620" y="265" width="160" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="700.0" y="287" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">istio-init</text>
<text x="700.0" y="307" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">먼저 잠깐 실행 후 종료</text>
<rect x="620" y="355" width="510" height="115" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="635" y="378" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="start">iptables 규칙을 심는다</text>
<text x="635" y="402" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· 파드로 들어오는 TCP → 15006 (Envoy 인바운드)</text>
<text x="635" y="424" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· 파드에서 나가는 TCP → 15001 (Envoy 아웃바운드)</text>
<text x="635" y="446" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="start">· 예외: 같은 파드 안 127.0.0.1 (루프백) 은 가로채지 않는다</text>
<rect x="800" y="265" width="330" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="965" y="290" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">READY 2/2 → 3/3</text>
<text x="965" y="314" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">nginx + ssr + istio-proxy (init 은 끝나서 안 셈)</text>
<rect x="30" y="510" width="1120" height="275" rx="12" fill="#E1F5EE" fill-opacity="0.45" stroke="#0F6E56" stroke-width="1" stroke-dasharray="7 5"/>
<text x="42" y="530" font-size="13" font-weight="700" fill="#04342C" text-anchor="start">그 결과 — 파드 안 트래픽 경로</text>
<rect x="55" y="560" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="140.0" y="600.0" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">바깥 (ALB, 게이트웨이)</text>
<rect x="300" y="545" width="820" height="210" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="320" y="570" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="start">파드 front-end-next</text>
<rect x="330" y="590" width="200" height="70" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="430.0" y="612" font-size="14" font-weight="700" fill="#173404" text-anchor="middle">istio-proxy</text>
<text x="430.0" y="632" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">:15006 로 받음</text>
<rect x="600" y="590" width="200" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="700.0" y="612" font-size="14" font-weight="700" fill="#26215C" text-anchor="middle">nginx</text>
<text x="700.0" y="632" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle">:80</text>
<rect x="870" y="590" width="200" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="970.0" y="612" font-size="14" font-weight="700" fill="#26215C" text-anchor="middle">ssr (Next.js)</text>
<text x="970.0" y="632" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle">:3000</text>
<path d="M225 595 L330 620" fill="none" stroke="#3B6D11" stroke-width="2" marker-end="url(#a3B6D11)"/>
<text x="277" y="590" font-size="11" font-weight="400" fill="#3B6D11" text-anchor="middle">iptables 가 우회</text>
<path d="M530 625 L600 625" fill="none" stroke="#3B6D11" stroke-width="2" marker-end="url(#a3B6D11)"/>
<path d="M800 625 L870 625" fill="none" stroke="#534AB7" stroke-width="2" marker-end="url(#a534AB7)"/>
<text x="835" y="615" font-size="11" font-weight="400" fill="#534AB7" text-anchor="middle">127.0.0.1</text>
<text x="320" y="690" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· 바깥 → 파드 : 반드시 istio-proxy 를 거친다 (암호화 해제, 기록)</text>
<text x="320" y="712" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· nginx → Next.js : 같은 파드 안 루프백이라 사이드카를 거치지 않는다</text>
<text x="320" y="734" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="start">· 앱 코드·nginx 설정은 한 줄도 안 바뀌었다</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
