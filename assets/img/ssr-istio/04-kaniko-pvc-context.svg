<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" style="max-width:100%;height:auto" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a854F0B" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#854F0B"/></marker></defs><rect width="1100" height="560" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#2C2C2A" text-anchor="start">Kaniko 빌드 컨텍스트 — 젠킨스가 받은 소스를 Kaniko 는 어떻게 보나</text>
<rect x="20" y="60" width="480" height="300" rx="12" fill="#F1EFE8" fill-opacity="0.45" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="7 5"/>
<text x="32" y="80" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="start">젠킨스 에이전트 파드</text>
<rect x="40" y="95" width="440" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="260.0" y="117" font-size="14" font-weight="700" fill="#412402" text-anchor="middle">/home/jenkins/agent</text>
<text x="260.0" y="137" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle">← jenkins-agent-pvc 마운트 지점</text>
<rect x="70" y="160" width="410" height="50" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="275.0" y="190.0" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">workspace/</text>
<rect x="100" y="225" width="380" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="290.0" y="247" font-size="14" font-weight="700" fill="#26215C" text-anchor="middle">workspace/${JOB_NAME}/</text>
<text x="290.0" y="267" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle">= workspace/lms-ssr-poc-svc/</text>
<text x="40" y="315" font-size="12" font-weight="400" fill="#26215C" text-anchor="start">AGENT_WORKSPACE_BUILD_PATH = .../workspace/${JOB_NAME}</text>
<text x="40" y="335" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">checkout 이 앱 소스를 여기에 받는다</text>
<rect x="600" y="60" width="480" height="300" rx="12" fill="#FAECE7" fill-opacity="0.45" stroke="#993C1D" stroke-width="1" stroke-dasharray="7 5"/>
<text x="612" y="80" font-size="13" font-weight="700" fill="#4A1B0C" text-anchor="start">Kaniko 파드</text>
<rect x="620" y="95" width="440" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="840.0" y="117" font-size="14" font-weight="700" fill="#4A1B0C" text-anchor="middle">/workspace</text>
<text x="840.0" y="137" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle">← Dockerfile ConfigMap · 빌드 컨텍스트 루트</text>
<rect x="650" y="160" width="410" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="855.0" y="182" font-size="14" font-weight="700" fill="#412402" text-anchor="middle">buildpath/</text>
<text x="855.0" y="202" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle">← 같은 PVC 마운트 지점</text>
<rect x="680" y="225" width="380" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="870.0" y="247" font-size="14" font-weight="700" fill="#26215C" text-anchor="middle">buildpath/workspace/${PROJECT}/</text>
<text x="870.0" y="267" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle">PROJECT = pod.project = JOB_NAME</text>
<text x="620" y="315" font-size="12" font-weight="400" fill="#26215C" text-anchor="start">COPY buildpath/workspace/${PROJECT}/ ./</text>
<text x="620" y="335" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">--context=/workspace 가 고정이라 buildpath/ 로 시작한다</text>
<rect x="500" y="60" width="100" height="300" rx="12" fill="#FFFFFF" fill-opacity="0.45" stroke="#888780" stroke-width="1"/>
<text x="512" y="80" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="start"></text>
<rect x="510" y="150" width="80" height="120" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="550.0" y="215.0" font-size="14" font-weight="700" fill="#412402" text-anchor="middle">PVC</text>
<text x="550" y="300" font-size="11" font-weight="400" fill="#854F0B" text-anchor="middle">같은 볼륨</text>
<path d="M480 120 L510 190" fill="none" stroke="#854F0B" stroke-width="1.6" marker-end="url(#a854F0B)"/>
<path d="M590 190 L620 185" fill="none" stroke="#854F0B" stroke-width="1.6" marker-end="url(#a854F0B)"/>
<rect x="20" y="390" width="1060" height="150" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="40" y="418" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="start">경로가 맞아야 하는 두 곳</text>
<text x="40" y="445" font-size="13" font-weight="400" fill="#26215C" text-anchor="start">젠킨스: workspace/${JOB_NAME}    ↔    Dockerfile: buildpath/workspace/${PROJECT}</text>
<text x="40" y="472" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start">9/18 ~ 10/28: Dockerfile 에 lms-ssr-poc 를 고정 → 잡 이름을 lms-ssr-poc-svc 로 바꾸자 "no such file or directory" (10/29)</text>
<text x="40" y="497" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start">10/29 이후: 젠킨스가 이미 넘기던 pod.project(=JOB_NAME)를 image-build 차트가 --build-arg PROJECT 로 전달 → Dockerfile 이 ARG 로 받는다</text>
<text x="40" y="522" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">같은 에러가 9/18 에도 났지만 원인은 달랐다 — 그땐 post 블록의 rm -rf 가 Kaniko 보다 먼저 워크스페이스를 지웠다</text></svg>
