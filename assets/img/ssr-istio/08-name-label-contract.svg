<text x="30" y="590" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">istio: ingressgateway-test-lms 라벨은 Istio 설치 차트(addon/istio values 의 gateways) 가 붙이고, 앱 차트(mesh.gw.target_gw_svc) 가 참조한다.</text>
<text x="30" y="610" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">과목을 추가할 때 두 곳을 같은 이름으로 맞춘다. helm template 로 렌더링해 이 표의 값을 하나씩 확인하는 것이 가장 빠른 검증이다.</text></svg>
