<svg width="700" height="420" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="700" height="420" fill="#fbfcfd"/>

  <text x="350" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">스테이징 클러스터 토폴로지</text>
  <text x="350" y="56" text-anchor="middle" font-size="12" fill="#8b949e">네임스페이스만 다른 게 아니라 클러스터 자체가 물리적으로 갈려있었다</text>

  <!-- Cluster A -->
  <rect x="60" y="86" width="280" height="220" rx="10" fill="#eef2ff" stroke="#5a5fc7" stroke-width="1.6"/>
  <text x="200" y="116" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3b3fa8">클러스터 A</text>

  <rect x="90" y="140" width="220" height="66" rx="7" fill="#ffffff" stroke="#c7cbf5" stroke-width="1.2"/>
  <text x="200" y="166" text-anchor="middle" font-size="12.5" font-weight="600" fill="#24292f">수학 (일반)</text>
  <text x="200" y="184" text-anchor="middle" font-size="10.5" fill="#8b949e">namespace: math</text>

  <rect x="90" y="216" width="220" height="66" rx="7" fill="#ffffff" stroke="#c7cbf5" stroke-width="1.2"/>
  <text x="200" y="242" text-anchor="middle" font-size="12.5" font-weight="600" fill="#24292f">수학 (글로벌)</text>
  <text x="200" y="260" text-anchor="middle" font-size="10.5" fill="#8b949e">namespace: global-math</text>

  <!-- Cluster B -->
  <rect x="360" y="86" width="280" height="220" rx="10" fill="#eafaf1" stroke="#2f9e5c" stroke-width="1.6"/>
  <text x="500" y="116" text-anchor="middle" font-size="14.5" font-weight="700" fill="#166534">클러스터 B</text>

  <rect x="390" y="140" width="220" height="66" rx="7" fill="#ffffff" stroke="#bfe6cf" stroke-width="1.2"/>
  <text x="500" y="166" text-anchor="middle" font-size="12.5" font-weight="600" fill="#24292f">영어 (일반)</text>
  <text x="500" y="184" text-anchor="middle" font-size="10.5" fill="#8b949e">namespace: eng</text>

  <rect x="390" y="216" width="220" height="66" rx="7" fill="#ffffff" stroke="#bfe6cf" stroke-width="1.2"/>
  <text x="500" y="242" text-anchor="middle" font-size="12.5" font-weight="600" fill="#24292f">영어 (글로벌)</text>
  <text x="500" y="260" text-anchor="middle" font-size="10.5" fill="#8b949e">namespace: global-eng</text>

  <rect x="40" y="330" width="620" height="70" rx="7" fill="#fdecec" stroke="#d1453b" stroke-width="1.3"/>
  <text x="350" y="358" text-anchor="middle" font-size="12" fill="#8c1f18">처음엔 네임스페이스만 다른 줄 알았는데,</text>
  <text x="350" y="380" text-anchor="middle" font-size="12" fill="#8c1f18">실제로는 물리적으로 다른 클러스터였다</text>
</svg>
