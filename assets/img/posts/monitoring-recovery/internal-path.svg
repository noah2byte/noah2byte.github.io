  <text x="125" y="469" text-anchor="middle" font-size="12.5" fill="#111827">운영 클러스터 A</text>
  <rect x="40" y="488" width="170" height="36" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="125" y="511" text-anchor="middle" font-size="12.5" fill="#111827">운영 클러스터 B</text>
