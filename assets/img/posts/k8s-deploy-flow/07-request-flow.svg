<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill:#1e293b; }
    .title { font-size:22px; font-weight:700; }
    .sub { font-size:13px; fill:#475569; }
    .h { font-size:14px; font-weight:700; }
    .t { font-size:12.5px; }
    .small { font-size:12px; fill:#475569; }
    .lab { font-size:12px; font-weight:700; }
    .code { font-family: 'DejaVu Sans Mono','Menlo','Consolas','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',monospace; font-size:11px; fill:#334155; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="30" y="40" class="title">사용자 요청이 백엔드 파드에 닿기까지 </text>
  <text x="30" y="64" class="sub">외부 요청은 웹서버로만 들어오고, API는 nginx가 메시 안에서 백엔드로 넘긴다</text>

  <!-- mesh boundary -->
  <rect x="318" y="84" width="666" height="330" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="332" y="104" class="small">클러스터 · Istio 메시</text>

  <!-- top row -->
  <rect x="20" y="132" width="120" height="64" rx="10" fill="#ffffff" stroke="#334155"/>
  <text x="80" y="160" text-anchor="middle" class="h">브라우저</text>
  <text x="80" y="180" text-anchor="middle" class="small">사용자</text>

  <rect x="168" y="132" width="120" height="64" rx="10" fill="#ffffff" stroke="#334155"/>
  <text x="228" y="160" text-anchor="middle" class="h">클라우드 LB</text>
  <text x="228" y="180" text-anchor="middle" class="small">외부 진입</text>

  <rect x="340" y="120" width="230" height="88" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="455" y="144" text-anchor="middle" class="h">Istio Ingress Gateway</text>
  <text x="455" y="164" text-anchor="middle" class="code">web-gw</text>
  <text x="455" y="182" text-anchor="middle" class="code">+ web-vs</text>
  <text x="455" y="200" text-anchor="middle" class="small">(hosts *)</text>

  <rect x="610" y="114" width="360" height="100" rx="10" fill="#ffffff" stroke="#334155"/>
  <text x="624" y="134" class="lab">웹서버 파드 web-nginx</text>
  <rect x="624" y="144" width="130" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="689" y="168" text-anchor="middle" class="t" style="font-weight:700">istio-proxy</text>
  <text x="689" y="186" text-anchor="middle" class="small">들어오는 요청</text>
  <rect x="780" y="144" width="176" height="56" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="868" y="168" text-anchor="middle" class="t" style="font-weight:700">nginx</text>
  <text x="868" y="186" text-anchor="middle" class="small" style="font-size:11px">화면=정적 파일 / API=백엔드로</text>

  <line x1="140" y1="164" x2="164" y2="164" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="288" y1="164" x2="336" y2="164" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="570" y1="164" x2="606" y2="164" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="754" y1="172" x2="776" y2="172" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <!-- static branch -->
  

  <!-- API branch path -->
  
  <path d="M868,200 L868,262 L455,262 L455,302" fill="none" stroke="#15803d" stroke-width="2.2" marker-end="url(#arrg)"/>
  <text x="472" y="285" class="t" style="fill:#15803d;font-weight:700">API 요청: nginx conf 분기 → 내부 서비스 api-backend.app.svc</text>

  <!-- bottom row -->
  <rect x="340" y="306" width="230" height="88" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="455" y="330" text-anchor="middle" class="h">nginx 파드의 istio-proxy</text>
  <text x="455" y="350" text-anchor="middle" class="t">나가는 요청을 가로채</text>
  <text x="455" y="368" text-anchor="middle" class="small">api-backend-vs (Gateway 없음)</text>
  <text x="455" y="386" text-anchor="middle" class="small">Envoy가 Ready 백엔드 파드 하나 선택</text>

  <rect x="610" y="300" width="360" height="100" rx="10" fill="#ffffff" stroke="#334155"/>
  <text x="624" y="320" class="lab">백엔드 파드 api-backend</text>
  <rect x="624" y="330" width="130" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="689" y="354" text-anchor="middle" class="t" style="font-weight:700">istio-proxy</text>
  <text x="689" y="372" text-anchor="middle" class="small">들어오는 요청</text>
  <rect x="780" y="330" width="176" height="56" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="868" y="354" text-anchor="middle" class="t" style="font-weight:700">api-backend (앱)</text>
  <text x="868" y="372" text-anchor="middle" class="small">Spring Boot</text>

  <line x1="570" y1="350" x2="606" y2="350" stroke="#15803d" stroke-width="2.2" marker-end="url(#arrg)"/>
  <line x1="754" y1="358" x2="776" y2="358" stroke="#15803d" stroke-width="2.2" marker-end="url(#arrg)"/>

  <!-- blocked external -->
  <path d="M228,196 L228,350 L330,350" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="236" y="290" class="t" style="fill:#b91c1c;font-weight:700">외부에서</text>
  <text x="236" y="308" class="t" style="fill:#b91c1c;font-weight:700">백엔드 직행 불가</text>

  <!-- note -->
  <rect x="20" y="430" width="964" height="74" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="40" y="456" class="t"><tspan font-weight="700">왜 이렇게 생겼나:</tspan> 백엔드 VirtualService(api-backend-vs)에는 Gateway가 연결돼 있지 않다 → 외부에서 직접 들어올 길이 없고,</text>
  <text x="40" y="478" class="t">nginx를 통해 메시 안에서만 호출된다. 백엔드가 외부에 직접 노출되지 않아 <tspan font-weight="700">공격 표면이 줄어든다</tspan>. (보안 회사 면접에서 덧붙일 한 문장)</text>
  <text x="40" y="498" class="small">※ 사이드카가 있는 파드에서 나가는 트래픽은 kube-proxy가 아니라 Envoy가 직접 엔드포인트를 골라 보낸다</text>
</svg>
