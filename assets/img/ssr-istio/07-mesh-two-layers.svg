<text x="125.0" y="307" font-size="13" font-weight="700" fill="#173404" text-anchor="middle">istio-proxy</text>
<text x="125.0" y="327" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">15006 가로챔</text>
<rect x="210" y="285" width="140" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="280.0" y="307" font-size="13" font-weight="700" fill="#26215C" text-anchor="middle">nginx</text>
<text x="280.0" y="327" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle">:80</text>
<rect x="365" y="285" width="140" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="435.0" y="307" font-size="13" font-weight="700" fill="#26215C" text-anchor="middle">next</text>
<text x="435.0" y="327" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle">:3000</text>
<path d="M195 315 L210 315" fill="none" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#a1D9E75)"/>
<path d="M350 315 L365 315" fill="none" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#a1D9E75)"/>
<rect x="40" y="390" width="220" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1" stroke-dasharray="6 4"/>
<text x="150.0" y="412" font-size="14" font-weight="700" fill="#412402" text-anchor="middle">ingressgateway</text>
<text x="150.0" y="432" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle">떠 있지만 미사용</text>
<text x="40" y="470" font-size="12" font-weight="400" fill="#04342C" text-anchor="start">켜는 법: kubectl label ns test-lms istio-injection=enabled</text>
<text x="40" y="490" font-size="12" font-weight="400" fill="#04342C" text-anchor="start">         + 파드 재시작 (사이드카는 생성 시점에만 주입)</text>
<text x="40" y="512" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">되는 것: mTLS(호출 측), 관찰, 백엔드 호출 정책</text>
<rect x="560" y="60" width="520" height="470" rx="12" fill="#FAEEDA" fill-opacity="0.45" stroke="#854F0B" stroke-width="1" stroke-dasharray="7 5"/>
<text x="572" y="80" font-size="13" font-weight="700" fill="#412402" text-anchor="start">2단계 — 입구까지 (mesh.enabled: true)</text>
<rect x="720" y="95" width="200" height="45" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
