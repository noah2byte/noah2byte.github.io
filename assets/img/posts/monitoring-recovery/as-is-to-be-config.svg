<svg width="1000" height="604" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 604" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369A1"/></marker></defs><rect width="1000" height="604" fill="#FFFFFF"/><text x="20" y="32" font-size="17" fill="#111827" font-weight="700">구성 비교 — 무엇이 어떻게 바뀌었나</text><text x="20" y="54" font-size="12" fill="#4B5563">초록 = 바뀌어서 동작 확인 · 주황 = 바뀌지 않았거나 후속 조치 필요</text><rect x="20" y="72" width="960" height="32" fill="#F3F4F6"/><text x="30" y="93" font-size="12.5" fill="#111827" font-weight="700">항목</text><text x="180" y="93" font-size="12.5" fill="#111827" font-weight="700">AS-IS</text><text x="450" y="93" font-size="12.5" fill="#111827" font-weight="700">TO-BE</text><text x="720" y="93" font-size="12.5" fill="#111827" font-weight="700">이유 / 다음</text><rect x="440" y="108" width="266" height="32" rx="6" fill="#F0FDF4"/><text x="30" y="129" font-size="12" fill="#111827" font-weight="700">Mimir 진입점</text><text x="180" y="129" font-size="11" fill="#991B1B">공인 ALB 미생성 · HTTPS · 인증서 만료</text><text x="450" y="129" font-size="11" fill="#166534" font-weight="700">사설 ALB · HTTP 80</text><text x="720" y="129" font-size="11" fill="#4B5563">내부용. 인증서 만료로 끊길 일 제거</text><line x1="20" y1="144" x2="980" y2="144" stroke="#E5E7EB"/><rect x="20" y="144" width="960" height="40" fill="#FAFAFA"/><rect x="440" y="148" width="266" height="32" rx="6" fill="#F0FDF4"/><text x="30" y="169" font-size="12" fill="#111827" font-weight="700">DNS</text><text x="180" y="169" font-size="11" fill="#991B1B">→ 옛 LB IP (소멸한 LB)</text><text x="450" y="169" font-size="11" fill="#166534" font-weight="700">→ 사설 ALB (레코드 값만 변경)</text><text x="720" y="169" font-size="11" fill="#4B5563">LB를 다시 만들면 값도 같이 갱신</text><line x1="20" y1="184" x2="980" y2="184" stroke="#E5E7EB"/><rect x="440" y="188" width="266" height="32" rx="6" fill="#FFFBEB"/><text x="30" y="209" font-size="12" fill="#111827" font-weight="700">공인 LB NACL</text><text x="180" y="209" font-size="11" fill="#991B1B">출구 IP 8200만 허용</text><text x="450" y="209" font-size="11" fill="#92400E" font-weight="700">443 임시 추가 → 제거 예정</text><text x="720" y="209" font-size="11" fill="#4B5563">공인 경로를 안 쓴다</text><line x1="20" y1="224" x2="980" y2="224" stroke="#E5E7EB"/><rect x="20" y="224" width="960" height="40" fill="#FAFAFA"/><rect x="440" y="228" width="266" height="32" rx="6" fill="#F0FDF4"/><text x="30" y="249" font-size="12" fill="#111827" font-weight="700">관리 Prometheus</text><text x="180" y="249" font-size="11" fill="#991B1B">https://mimir.example.com</text><text x="450" y="249" font-size="11" fill="#166534" font-weight="700">http://&lt;gateway&gt;.&lt;ns&gt;.svc</text><text x="720" y="249" font-size="11" fill="#4B5563">Mimir와 같은 클러스터</text><line x1="20" y1="264" x2="980" y2="264" stroke="#E5E7EB"/><rect x="440" y="268" width="266" height="32" rx="6" fill="#F0FDF4"/><text x="30" y="289" font-size="12" fill="#111827" font-weight="700">Grafana 데이터소스</text><text x="180" y="289" font-size="11" fill="#991B1B">https://mimir.example.com/prometheus</text><text x="450" y="289" font-size="11" fill="#166534" font-weight="700">http://&lt;gateway&gt;.&lt;ns&gt;.svc/prometheus</text><text x="720" y="289" font-size="11" fill="#4B5563">같은 클러스터 · 진입점 전환 전에 먼저</text><line x1="20" y1="304" x2="980" y2="304" stroke="#E5E7EB"/><rect x="20" y="304" width="960" height="40" fill="#FAFAFA"/><rect x="440" y="308" width="266" height="32" rx="6" fill="#F0FDF4"/><text x="30" y="329" font-size="12" fill="#111827" font-weight="700">운영 A Prometheus</text><text x="180" y="329" font-size="11" fill="#991B1B">https 도메인 → 타임아웃</text><text x="450" y="329" font-size="11" fill="#166534" font-weight="700">http 도메인 → 사설 ALB</text><text x="720" y="329" font-size="11" fill="#4B5563">사설 ALB는 HTTP만 연다</text><line x1="20" y1="344" x2="980" y2="344" stroke="#E5E7EB"/><rect x="440" y="348" width="266" height="32" rx="6" fill="#F0FDF4"/><text x="30" y="369" font-size="12" fill="#111827" font-weight="700">운영 B Prometheus</text><text x="180" y="369" font-size="11" fill="#991B1B">remoteWrite 없음 · 앱 메트릭 미수집</text><text x="450" y="369" font-size="11" fill="#166534" font-weight="700">Helm values · cluster=b · 셀렉터 2개</text><text x="720" y="369" font-size="11" fill="#4B5563">운영 A 기준으로 통일</text><line x1="20" y1="384" x2="980" y2="384" stroke="#E5E7EB"/><rect x="20" y="384" width="960" height="40" fill="#FAFAFA"/><rect x="440" y="388" width="266" height="32" rx="6" fill="#F0FDF4"/><text x="30" y="409" font-size="12" fill="#111827" font-weight="700">Mimir 수신</text><text x="180" y="409" font-size="11" fill="#991B1B">0 (약 8개월)</text><text x="450" y="409" font-size="11" fill="#166534" font-weight="700">mgmt · federation(a·b)</text><text x="720" y="409" font-size="11" fill="#4B5563"></text><line x1="20" y1="424" x2="980" y2="424" stroke="#E5E7EB"/><rect x="440" y="428" width="266" height="32" rx="6" fill="#FFFBEB"/><text x="30" y="449" font-size="12" fill="#111827" font-weight="700">로그 (Loki)</text><text x="180" y="449" font-size="11" fill="#991B1B">도메인 타임아웃 · 배치 폐기</text><text x="450" y="449" font-size="11" fill="#92400E" font-weight="700">변화 없음</text><text x="720" y="449" font-size="11" fill="#4B5563">진입점 확인 후 내부 주소로</text><line x1="20" y1="464" x2="980" y2="464" stroke="#E5E7EB"/><rect x="20" y="464" width="960" height="40" fill="#FAFAFA"/><rect x="440" y="468" width="266" height="32" rx="6" fill="#FFFBEB"/><text x="30" y="489" font-size="12" fill="#111827" font-weight="700">exporter</text><text x="180" y="489" font-size="11" fill="#991B1B">이전 연차 대상 · 일부 down</text><text x="450" y="489" font-size="11" fill="#92400E" font-weight="700">변화 없음</text><text x="720" y="489" font-size="11" fill="#4B5563">현재 대상 기준으로 새로 구성</text><line x1="20" y1="504" x2="980" y2="504" stroke="#E5E7EB"/><rect x="440" y="508" width="266" height="32" rx="6" fill="#FFFBEB"/><text x="30" y="529" font-size="12" fill="#111827" font-weight="700">알림</text><text x="180" y="529" font-size="11" fill="#991B1B">receiver null</text><text x="450" y="529" font-size="11" fill="#92400E" font-weight="700">변화 없음</text><text x="720" y="529" font-size="11" fill="#4B5563">수집 중단 알림부터</text><line x1="20" y1="544" x2="980" y2="544" stroke="#E5E7EB"/><rect x="20" y="544" width="960" height="40" fill="#FAFAFA"/><rect x="440" y="548" width="266" height="32" rx="6" fill="#FFFBEB"/><text x="30" y="569" font-size="12" fill="#111827" font-weight="700">Helm 드리프트</text><text x="180" y="569" font-size="11" fill="#4B5563">없음 (values 그대로)</text><text x="450" y="569" font-size="11" fill="#92400E" font-weight="700">kubectl 수동 변경 4건</text><text x="720" y="569" font-size="11" fill="#4B5563">다음 upgrade 때 원복 위험</text><line x1="20" y1="584" x2="980" y2="584" stroke="#E5E7EB"/></svg>
