<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1280" width="960" height="1280" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="960" height="1280" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#111827">실행 1회의 흐름 (agent.py v1.1)</text>
  <text x="40" y="68" font-size="13" fill="#6b7280">타이머가 30분마다 이 흐름을 한 번 실행한다</text>

  <!-- start -->
  <rect x="210" y="88" width="240" height="40" rx="20" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="330" y="113" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">타이머 발동</text>
  <line x1="330" y1="128" x2="330" y2="146" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="150" y="150" width="360" height="58" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="330" y="175" font-size="14" font-weight="700" fill="#831843" text-anchor="middle">설정 로드</text>
  <text x="330" y="196" font-size="12" fill="#9d174d" text-anchor="middle">/etc/notice-agent.env → 환경변수 (systemd가 주입)</text>
  <line x1="330" y1="208" x2="330" y2="228" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="150" y="232" width="360" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="257" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">RSS 2개 수집 · collect()</text>
  <text x="330" y="278" font-size="12" fill="#1e40af" text-anchor="middle">GitLab patch-releases.xml · Jenkins rss.xml</text>
  <line x1="330" y1="290" x2="330" y2="314" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>

  <polygon points="330,318 480,360 330,402 180,360" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="330" y="356" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">state.db에 없는</text>
  <text x="330" y="374" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">새 공지가 있나?</text>

  <line x1="480" y1="360" x2="596" y2="360" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="500" y="352" font-size="12" fill="#6b7280">없음</text>
  <rect x="600" y="331" width="300" height="58" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="750" y="356" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">종료 — LLM은 띄우지 않음</text>
  <text x="750" y="377" font-size="12" fill="#4b5563" text-anchor="middle">대부분의 실행은 여기서 바로 끝난다</text>

  <line x1="330" y1="402" x2="330" y2="426" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="338" y="420" font-size="12" fill="#6b7280">있음</text>

  <rect x="150" y="430" width="360" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="455" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">이번 실행에서 처리할 공지 최대 3건</text>
  <text x="330" y="476" font-size="12" fill="#1e40af" text-anchor="middle">NA_MAX_PER_RUN · 나머지는 다음 실행으로 넘김</text>
  <line x1="330" y1="488" x2="330" y2="508" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="150" y="512" width="360" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="330" y="537" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle">LLM 컨테이너 기동 · start_llm()</text>
  <text x="330" y="558" font-size="12" fill="#92400e" text-anchor="middle">docker run → /health 응답 대기 (최대 180초)</text>
  <line x1="330" y1="570" x2="330" y2="636" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- loop region -->
  <rect x="100" y="600" width="830" height="510" rx="12" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="914" y="626" font-size="13" font-weight="700" fill="#1e40af" text-anchor="end">공지 1건마다 반복</text>

  <rect x="150" y="640" width="360" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="665" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">페이지 GET → 원문 보안 표 · CVE 섹션 추출</text>
  <text x="330" y="686" font-size="12" fill="#1e40af" text-anchor="middle">코드가 원문 그대로 (심각도 · CVE · CVSS)</text>
  <line x1="330" y1="698" x2="330" y2="712" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="150" y="716" width="360" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="330" y="741" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle">LLM: 개요 1회 + CVE마다 1문장</text>
  <text x="330" y="762" font-size="12" fill="#92400e" text-anchor="middle">원문과 대조 검사 → 실패 시 영어 원문</text>
  <line x1="330" y1="774" x2="330" y2="788" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="150" y="792" width="360" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="822" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">out/에 md · json 저장</text>
  <line x1="330" y1="842" x2="330" y2="862" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="150" y="866" width="360" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="330" y="896" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">jira-notify.py 실행 (NA_NOTIFY_CMD)</text>
  <line x1="330" y1="916" x2="330" y2="932" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>

  <polygon points="330,936 480,976 330,1016 180,976" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="330" y="972" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">요약·저장·알림이</text>
  <text x="330" y="990" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">모두 성공했나?</text>

  <line x1="330" y1="1016" x2="330" y2="1036" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="338" y="1031" font-size="12" fill="#6b7280">예</text>
  <rect x="150" y="1040" width="360" height="44" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="330" y="1067" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">state.db에 done 기록</text>

  <line x1="480" y1="976" x2="596" y2="976" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="500" y="968" font-size="12" fill="#6b7280">아니오</text>
  <rect x="600" y="947" width="300" height="58" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="750" y="972" font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="middle">state.db에 error · tries+1</text>
  <text x="750" y="993" font-size="12" fill="#991b1b" text-anchor="middle">다음 실행에서 재시도 · 3회 실패 시 포기</text>

  <!-- loop back -->
  <path d="M750,1005 L750,1094 L122,1094 L122,669 L146,669" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M150,1062 L122,1062" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="136" y="860" font-size="11" fill="#1e40af" text-anchor="middle" transform="rotate(-90 136 860)">다음 공지</text>

  <!-- after loop -->
  <line x1="330" y1="1110" x2="330" y2="1142" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="338" y="1132" font-size="12" fill="#6b7280">반복이 끝나면 (오류가 나도 항상 · finally)</text>
  <rect x="150" y="1146" width="360" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="330" y="1176" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle">LLM 컨테이너 종료 · docker stop</text>
  <line x1="330" y1="1196" x2="330" y2="1216" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="230" y="1220" width="200" height="38" rx="19" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="330" y="1244" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">끝</text>
</svg>
