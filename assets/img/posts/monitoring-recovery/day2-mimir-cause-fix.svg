<svg width="1000" height="520" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect width="1000" height="520" fill="#FFFFFF"/>
  <text x="10" y="22" font-size="14" font-weight="700" fill="#111827">Mimir 장기 조회 고장 — 원인 사슬과 3단계 조치</text>
  <text x="10" y="52" font-size="13" font-weight="700" fill="#111827">원인</text>
  <rect x="10" y="62" width="300" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="160.0" y="87.46" font-size="11" font-weight="700" text-anchor="middle" fill="#991B1B">① 보관 기간 없음 (처음부터)</text>
  <text x="160.0" y="104.46" font-size="10" text-anchor="middle" fill="#991B1B">2025-03 데이터부터 무기한 누적</text>
  <rect x="10" y="136" width="300" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="160.0" y="161.46" font-size="11" font-weight="700" text-anchor="middle" fill="#991B1B">② 공용 버킷 최상위에 외부가 매시간 폴더</text>
  <text x="160.0" y="178.46" font-size="10" text-anchor="middle" fill="#991B1B">약 3만 개 → Mimir가 테넌트로 오인</text>
  <rect x="10" y="210" width="300" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="160.0" y="235.46" font-size="11" font-weight="700" text-anchor="middle" fill="#991B1B">compactor가 3만 개를 순회</text>
  <text x="160.0" y="252.46" font-size="10" text-anchor="middle" fill="#991B1B">한 바퀴 5~6시간 → 220일 성공 0회</text>
  <path d="M160 198 L160 208" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="10" y="284" width="300" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="160.0" y="309.46" font-size="11" font-weight="700" text-anchor="middle" fill="#991B1B">블록이 합쳐지지 않음</text>
  <text x="160.0" y="326.46" font-size="10" text-anchor="middle" fill="#991B1B">운영 테넌트 4,536개</text>
  <path d="M160 272 L160 282" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M310 92 L330 92 L330 314 L312 314" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="10" y="358" width="300" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="160.0" y="383.46" font-size="11" font-weight="700" text-anchor="middle" fill="#991B1B">③ store-gateway 목차가 디스크 10Gi 초과</text>
  <text x="160.0" y="400.46" font-size="10" text-anchor="middle" fill="#991B1B">준비 실패 · 블록 로딩 실패</text>
  <path d="M160 346 L160 356" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="10" y="432" width="300" height="56" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="160.0" y="455.32" font-size="12" font-weight="700" text-anchor="middle" fill="#991B1B">12시간 넘는 조회 전부 실패</text>
  <text x="160.0" y="473.32" font-size="11" text-anchor="middle" fill="#991B1B">(저장은 정상)</text>
  <path d="M160 420 L160 430" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="380" y="52" font-size="13" font-weight="700" fill="#111827">조치 (모두 helm diff로 범위 확인한 한 줄 변경)</text>
  <rect x="380" y="62" width="600" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
  <circle cx="404" cy="86" r="11" fill="#374151"/>
  <text x="404" y="90.5" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="424" y="91" font-size="12" font-weight="700" fill="#92400E">1차 · rev 14 · 09:34</text>
  <text x="392" y="120" font-size="12" font-weight="700" fill="#111827">store-gateway: enabled-tenants=관리 테넌트,운영 테넌트</text>
  <text x="392" y="146" font-size="11" fill="#374151">쓰레기 폴더 무시, 경고 폭주 해소. 그러나 운영 테넌트 목차만으로 디스크 부족</text>
  <rect x="380" y="188" width="600" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1"/>
  <circle cx="404" cy="212" r="11" fill="#374151"/>
  <text x="404" y="216.5" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="424" y="217" font-size="12" font-weight="700" fill="#92400E">2차 · rev 15 · 09:54</text>
  <text x="392" y="246" font-size="12" font-weight="700" fill="#111827">compactor: enabled-tenants=관리 테넌트,운영 테넌트</text>
  <text x="392" y="272" font-size="11" fill="#374151">220일 만에 합치기 시작. 그러나 2025년 블록이 커서 작업 디스크 부족</text>
  <rect x="380" y="314" width="600" height="110" rx="10" fill="#F0FDF4" stroke="#15803D" stroke-width="1"/>
  <circle cx="404" cy="338" r="11" fill="#374151"/>
  <text x="404" y="342.5" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="424" y="343" font-size="12" font-weight="700" fill="#166534">3차 · rev 16 · 10:41 (팀장 승인)</text>
  <text x="392" y="372" font-size="12" font-weight="700" fill="#111827">보관 기간 100일 (runtime 설정, 재시작 없음)</text>
  <text x="392" y="398" font-size="11" fill="#374151">오래된 블록 4,901개 삭제 → 13:05 블록 21개, 7일 조회 정상 (복구 완료)</text>
  <rect x="380" y="440" width="600" height="48" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="680.0" y="467.96" font-size="11" font-weight="700" text-anchor="middle" fill="#1E40AF">무작정 디스크를 늘리지 않은 이유: 보관 기간이 없으면 늘린 디스크도 다시 찬다</text>
</svg>
