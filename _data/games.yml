# 게임 탭(_tabs/game.md)에 카드로 렌더링되는 게임 목록.
# 게임을 추가하려면 아래 형식으로 항목만 추가하면 됩니다. (HTML 수정 불필요)
#
# - title: 게임 제목
#   description: 한 줄 설명
#   url: https://example.com/
#   category: 카테고리 (예: 미니게임, 퍼즐 ...)
#   icon: 이모지 하나 (선택, 기본값은 🎮)

#
# 아래 필드는 선택이며, 없으면 기본 모양으로 표시된다
#   id: 딥링크 주소(/game/#id)에 쓰는 이름 (기본값은 url의 마지막 경로. 예: world-bomb-war-game)
#   thumbnail: 카드 상단 이미지 경로 (없으면 아이콘을 크게 보여주는 기본 커버)
#   controls: 조작법 한 줄
#   source: 소스 저장소 주소 (플레이어 상단에 "소스" 버튼으로 표시)
