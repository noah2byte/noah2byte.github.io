<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill:#1e293b; }
    .title { font-size:22px; font-weight:700; }
    .sub { font-size:13px; fill:#475569; }
    .q { font-size:14px; font-weight:700; }
    .t { font-size:12.5px; }
    .code { font-family: 'DejaVu Sans Mono','Menlo','Consolas','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',monospace; font-size:11.5px; fill:#334155; }
    .yes { font-size:12px; font-weight:700; fill:#15803d; }
    .no { font-size:12px; font-weight:700; fill:#b91c1c; }
    .small { font-size:12px; fill:#475569; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="720" fill="#ffffff"/>
  <text x="30" y="40" class="title">"파드는 Running인데 트래픽을 안 받는다" — 보는 순서</text>
  <text x="30" y="64" class="sub">처음엔 ②(EndpointSlice)만 말했다 → 앞의 ①과 뒤의 ③④를 붙이면 완성</text>

  <!-- start -->
  <rect x="160" y="84" width="380" height="44" rx="22" fill="#1e293b"/>
  <text x="350" y="112" text-anchor="middle" class="q" style="fill:#ffffff">Running인데 트래픽이 안 들어온다</text>
  <line x1="350" y1="128" x2="350" y2="148" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Q1 -->
  <rect x="120" y="152" width="460" height="64" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="140" y="178" class="q">① READY가 전부 찼나?</text>
  <text x="140" y="200" class="code">k get pod -n app   → READY 3/3 ?</text>
  <line x1="580" y1="184" x2="626" y2="184" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="588" y="176" class="no">아니오</text>
  <rect x="630" y="148" width="310" height="76" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="644" y="170" class="t"><tspan font-weight="700">describe로 readiness 실패 이유</tspan></text>
  <text x="644" y="190" class="t">경로·포트(15020 재작성), initialDelay 50s,</text>
  <text x="644" y="210" class="t">앱 기동 지연, Vault init 대기</text>
  <line x1="350" y1="216" x2="350" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="358" y="238" class="yes">예</text>

  <!-- Q2 -->
  <rect x="120" y="252" width="460" height="64" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="140" y="278" class="q">② EndpointSlice에 파드 IP가 있나? ← 처음 떠올린 곳</text>
  <text x="140" y="300" class="code">k get endpointslices -n app</text>
  <line x1="580" y1="284" x2="626" y2="284" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="588" y="276" class="no">아니오</text>
  <rect x="630" y="252" width="310" height="64" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="644" y="276" class="t"><tspan font-weight="700">Service selector ↔ 파드 라벨</tspan> 불일치?</text>
  <text x="644" y="298" class="t">Service 포트 이름·번호가 맞나?</text>
  <line x1="350" y1="316" x2="350" y2="348" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="358" y="338" class="yes">예</text>

  <!-- Q3 -->
  <rect x="120" y="352" width="460" height="64" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="140" y="378" class="q">③ Envoy가 그 엔드포인트를 알고 있나?</text>
  <text x="140" y="400" class="code">istioctl proxy-config endpoint &lt;pod&gt;</text>
  <line x1="580" y1="384" x2="626" y2="384" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="588" y="376" class="no">아니오</text>
  <rect x="630" y="352" width="310" height="64" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="644" y="376" class="t"><tspan font-weight="700">istiod 설정 전파 확인</tspan></text>
  <text x="644" y="398" class="code">istioctl proxy-status</text>
  <line x1="350" y1="416" x2="350" y2="448" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="358" y="438" class="yes">예</text>

  <!-- Q4 -->
  <rect x="120" y="452" width="460" height="64" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="140" y="478" class="q">④ 라우팅 규칙이 맞나?</text>
  <text x="140" y="500" class="code">VirtualService·Gateway host / istioctl analyze</text>
  <line x1="580" y1="484" x2="626" y2="484" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="588" y="476" class="no">아니오</text>
  <rect x="630" y="452" width="310" height="64" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="644" y="476" class="t"><tspan font-weight="700">호스트·경로 불일치 수정</tspan></text>
  <text x="644" y="498" class="code">istioctl proxy-config route &lt;pod&gt;</text>
  <line x1="350" y1="516" x2="350" y2="548" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="358" y="538" class="yes">예</text>

  <!-- end -->
  <rect x="120" y="552" width="460" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="578" class="q">⑤ Envoy 로그의 503 response flag로 분류</text>
  <text x="140" y="600" class="t">UH(대상 없음) · UF/UC(연결 실패·끊김) · NR(라우트 없음)</text>

  <!-- note -->
  <rect x="30" y="636" width="900" height="68" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="662" class="t"><tspan font-weight="700">원리:</tspan> Running = 컨테이너 프로세스가 떠 있음. Ready = readiness 통과. <tspan font-weight="700">트래픽은 Ready인 파드에만</tspan> 간다.</text>
  <text x="50" y="686" class="t">Istio 환경은 "EndpointSlice → istiod → Envoy"를 한 번 더 거치므로 ③④가 추가된다.</text>
</svg>
