<rect x="680" y="165" width="280" height="55" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="820.0" y="187" font-size="14" font-weight="700" fill="#0C447C" text-anchor="middle">ALB (재생성됨)</text>
<text x="820.0" y="207" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">Ingress 가 istio-system 으로 이동</text>
<path d="M820 220 L820 240" fill="none" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#a1D9E75)"/>
<rect x="680" y="240" width="280" height="55" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
