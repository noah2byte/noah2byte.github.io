<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" style="max-width:100%;height:auto" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a1D9E75" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#1D9E75"/></marker></defs><rect width="1100" height="600" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#2C2C2A" text-anchor="start">mesh 적용은 두 층이다 — 사이드카(라벨)와 입구(mesh.enabled)</text>
