<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" style="max-width:100%;height:auto" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a3B6D11" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3B6D11"/></marker><marker id="aA32D2D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#A32D2D"/></marker></defs><rect width="1180" height="640" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#2C2C2A" text-anchor="start">mTLS 모드 — PERMISSIVE 는 "둘 다 받기", STRICT 는 "암호화만 받기"</text>
<text x="24" y="56" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">mTLS = 양쪽이 서로 인증서를 보여 주고 확인한 뒤 암호화해서 통신하는 것. 사이드카끼리는 자동으로 한다</text>
<rect x="20" y="80" width="1140" height="250" rx="12" fill="#EAF3DE" fill-opacity="0.45" stroke="#3B6D11" stroke-width="1" stroke-dasharray="7 5"/>
<text x="32" y="100" font-size="13" font-weight="700" fill="#173404" text-anchor="start">PERMISSIVE (기본값) — 이번 PoC</text>
<rect x="40" y="120" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="120.0" y="142" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">ALB</text>
<text x="120.0" y="162" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">mesh 밖, 사이드카 없음</text>
<rect x="40" y="230" width="160" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="120.0" y="252" font-size="14" font-weight="700" fill="#412402" text-anchor="middle">게이트웨이</text>
<text x="120.0" y="272" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle">Envoy 있음</text>
<rect x="520" y="170" width="280" height="80" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="660.0" y="192" font-size="14" font-weight="700" fill="#173404" text-anchor="middle">앱 파드의 사이드카</text>
<text x="660.0" y="212" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">평문도 mTLS 도 받는다</text>
<path d="M200 150 L520 210" fill="none" stroke="#3B6D11" stroke-width="2" marker-end="url(#a3B6D11)"/>
<text x="360" y="142" font-size="11" font-weight="700" fill="#3B6D11" text-anchor="middle">평문 HTTP → 통과</text>
<path d="M200 260 L520 210" fill="none" stroke="#3B6D11" stroke-width="2" marker-end="url(#a3B6D11)"/>
<text x="360" y="278" font-size="11" font-weight="700" fill="#3B6D11" text-anchor="middle">mTLS → 통과</text>
<rect x="830" y="120" width="310" height="190" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="845" y="145" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· ALB 는 mesh 밖이라 암호화를 못 한다</text>
<text x="845" y="167" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· 그래도 PERMISSIVE 라 받아 준다</text>
<text x="845" y="189" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· 그래서 사이드카만 붙인 1단계에서</text>
<text x="845" y="211" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">  외부 접속이 안 끊겼다</text>
<text x="845" y="233" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· 게이트웨이 → 앱 은 자동 mTLS</text>
<text x="845" y="255" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">  (istio_requests_total 의</text>
<text x="845" y="277" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">   principal 라벨로 확인)</text>
<rect x="20" y="350" width="1140" height="250" rx="12" fill="#FCEBEB" fill-opacity="0.45" stroke="#A32D2D" stroke-width="1" stroke-dasharray="7 5"/>
<text x="32" y="370" font-size="13" font-weight="700" fill="#501313" text-anchor="start">STRICT — 운영 전 검토 대상</text>
<rect x="40" y="390" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="120.0" y="412" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">ALB</text>
<text x="120.0" y="432" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">mesh 밖, 사이드카 없음</text>
<rect x="40" y="500" width="160" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="120.0" y="522" font-size="14" font-weight="700" fill="#412402" text-anchor="middle">게이트웨이</text>
<text x="120.0" y="542" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle">Envoy 있음</text>
<rect x="520" y="440" width="280" height="80" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="660.0" y="462" font-size="14" font-weight="700" fill="#173404" text-anchor="middle">앱 파드의 사이드카</text>
<text x="660.0" y="482" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">mTLS 만 받는다</text>
<path d="M200 420 L520 480" fill="none" stroke="#A32D2D" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aA32D2D)"/>
<text x="360" y="412" font-size="11" font-weight="700" fill="#A32D2D" text-anchor="middle">평문 HTTP → 거부</text>
<path d="M200 530 L520 480" fill="none" stroke="#3B6D11" stroke-width="2" marker-end="url(#a3B6D11)"/>
<text x="360" y="548" font-size="11" font-weight="700" fill="#3B6D11" text-anchor="middle">mTLS → 통과</text>
<rect x="830" y="390" width="310" height="190" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="845" y="415" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· mesh 밖에서 앱을 바로 부르던</text>
<text x="845" y="437" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">  호출자는 전부 막힌다</text>
<text x="845" y="459" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· 입구가 게이트웨이로 옮겨 간 지금은</text>
<text x="845" y="481" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">  ALB 가 앱을 직접 부르지 않으므로</text>
<text x="845" y="503" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">  켤 수 있는 조건이 됐다</text>
<text x="845" y="525" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· 다만 mesh 밖 호출자가 정말 없는지</text>
<text x="845" y="547" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">  먼저 확인해야 한다</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
