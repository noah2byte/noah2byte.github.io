<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" style="max-width:100%;height:auto" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a5F5E5A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#5F5E5A"/></marker></defs><rect width="1100" height="520" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#2C2C2A" text-anchor="start">nginx.conf 관리 — 21개 파일 복제(AS-IS)에서 템플릿 1개 + values(TO-BE)로</text>
<rect x="20" y="60" width="520" height="420" rx="12" fill="#FAECE7" fill-opacity="0.45" stroke="#993C1D" stroke-width="1" stroke-dasharray="7 5"/>
<text x="32" y="80" font-size="13" font-weight="700" fill="#4A1B0C" text-anchor="start">AS-IS — 젠킨스가 만든다 (ArgoCD 밖)</text>
<rect x="40" y="95" width="480" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="280.0" y="117" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">addon/*.conf 21개</text>
<text x="280.0" y="137" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">stg-a-nginx.conf, prod-c-… 등 환경별 복제</text>
<path d="M280 165 L280 190" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a5F5E5A)"/>
<rect x="40" y="190" width="480" height="70" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="280.0" y="212" font-size="14" font-weight="700" fill="#4A1B0C" text-anchor="middle">replace-n.sh</text>
<text x="280.0" y="232" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle">sed 's/backend-ns/&lt;namespace&gt;/' — 치환은 이것 하나뿐</text>
<path d="M280 260 L280 285" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a5F5E5A)"/>
<rect x="40" y="285" width="480" height="70" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="280.0" y="307" font-size="14" font-weight="700" fill="#4A1B0C" text-anchor="middle">kubectl create configmap --dry-run | kubectl apply</text>
<text x="280.0" y="327" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle">헬름 차트의 ConfigMap.yaml 은 빈 파일</text>
<text x="40" y="390" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start">왜 21개가 됐나: 치환 가능한 값이 네임스페이스 하나라</text>
<text x="40" y="410" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start">버킷·CDN 도메인 같은 값은 파일에 박혀 환경마다 복제됐다</text>
<text x="40" y="435" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start">파일 비교 결과 차이는 구조가 아니라 값뿐이었다</text>
<text x="40" y="455" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">(stg-a = stg-b = prod-a, dev-a = mgmt, prod-d = prod-e)</text>
<rect x="560" y="60" width="520" height="420" rx="12" fill="#E1F5EE" fill-opacity="0.45" stroke="#0F6E56" stroke-width="1" stroke-dasharray="7 5"/>
<text x="572" y="80" font-size="13" font-weight="700" fill="#04342C" text-anchor="start">TO-BE — 헬름이 만든다 (ArgoCD 관리)</text>
<rect x="580" y="95" width="480" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="820.0" y="117" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">files/nginx-ssr.conf.tpl</text>
<text x="820.0" y="137" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">구조는 하나. 바뀌는 값은 {{ .Values… }}</text>
<path d="M820 165 L820 190" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a5F5E5A)"/>
<rect x="580" y="190" width="480" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="820.0" y="212" font-size="14" font-weight="700" fill="#04342C" text-anchor="middle">values.yaml</text>
<text x="820.0" y="232" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">nginx.serverNames · ssr.port (환경값은 여기로)</text>
<path d="M820 260 L820 285" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a5F5E5A)"/>
<rect x="580" y="285" width="480" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="820.0" y="307" font-size="14" font-weight="700" fill="#04342C" text-anchor="middle">templates/ConfigMap.yaml</text>
<text x="820.0" y="327" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">tpl 로 렌더링 → checksum/config 로 파드 자동 재시작</text>
<text x="580" y="390" font-size="12" font-weight="400" fill="#1D9E75" text-anchor="start">바뀐 핵심 한 곳: location / 가 정적 파일 서빙 대신</text>
<text x="580" y="410" font-size="12" font-weight="400" fill="#1D9E75" text-anchor="start">proxy_pass http://127.0.0.1:3000 (같은 파드의 Next)</text>
<text x="580" y="435" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start">백엔드·외부·CDN 블록은 reference-backend-blocks.conf 로 분리</text>
<text x="580" y="455" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">PoC 에 백엔드가 없어 검증 불가 → 연동 시점에 가져다 붙인다</text>
<text x="20" y="505" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">기존 CSR 의 21개 파일과 젠킨스 잡은 건드리지 않았다. 운영 중이고, 범위가 섞이면 문제 원인을 가릴 수 없기 때문이다.</text></svg>
