<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" width="960" height="820" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill:#1e293b; }
    .title { font-size:22px; font-weight:700; }
    .sub { font-size:13px; fill:#475569; }
    .step { font-size:14px; }
    .badge { font-size:13px; font-weight:700; fill:#ffffff; }
    .num { font-size:14px; font-weight:700; }
    .note { font-size:13px; }
    .small { font-size:12px; fill:#475569; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="820" fill="#ffffff"/>

  <text x="40" y="42" class="title">배포 명령이 도착한 뒤, 쿠버네티스 안에서 "누가" 무엇을 하나</text>
  <text x="40" y="66" class="sub">Jenkins 직접 배포·ArgoCD 배포 모두 ① 이후는 같다 · 빨간 번호 = 처음 설명할 때 빠뜨린 단계</text>

  <!-- legend -->
  <rect x="640" y="84" width="14" height="14" rx="3" fill="#64748b"/><text x="660" y="96" class="small">외부 도구</text>
  <rect x="730" y="84" width="14" height="14" rx="3" fill="#7c3aed"/><text x="750" y="96" class="small">컨트롤 플레인</text>
  <rect x="640" y="104" width="14" height="14" rx="3" fill="#0f766e"/><text x="660" y="116" class="small">웹훅</text>
  <rect x="730" y="104" width="14" height="14" rx="3" fill="#15803d"/><text x="750" y="116" class="small">노드(kubelet)</text>
  <rect x="840" y="104" width="14" height="14" rx="3" fill="#2563eb"/><text x="860" y="116" class="small">Istio</text>

  <!-- steps: y start 130, pitch 60 -->
  <!-- 1 -->
  <circle cx="80" cy="153" r="16" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="80" y="158" text-anchor="middle" class="num">1</text>
  <rect x="110" y="130" width="790" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="110" y="130" width="230" height="46" rx="8" fill="#64748b"/>
  <text x="225" y="158" text-anchor="middle" class="badge">Jenkins / ArgoCD</text>
  <text x="356" y="158" class="step">Deployment 변경을 API 서버에 보낸다 (helm upgrade / sync)</text>
  <line x1="80" y1="170" x2="80" y2="196" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2 -->
  <circle cx="80" cy="213" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="80" y="218" text-anchor="middle" class="num" style="fill:#b91c1c">2</text>
  <rect x="110" y="190" width="790" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="110" y="190" width="230" height="46" rx="8" fill="#7c3aed"/>
  <text x="225" y="218" text-anchor="middle" class="badge">kube-apiserver</text>
  <text x="356" y="218" class="step">인증·인가·검증 후 etcd에 저장한다. etcd에 직접 쓰는 건 API 서버뿐</text>
  <line x1="80" y1="230" x2="80" y2="256" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3 -->
  <circle cx="80" cy="273" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="80" y="278" text-anchor="middle" class="num" style="fill:#b91c1c">3</text>
  <rect x="110" y="250" width="790" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="110" y="250" width="230" height="46" rx="8" fill="#7c3aed"/>
  <text x="225" y="278" text-anchor="middle" class="badge">Deployment 컨트롤러</text>
  <text x="356" y="278" class="step">템플릿(이미지) 변경을 watch로 감지 → 새 ReplicaSet을 만든다</text>
  <line x1="80" y1="290" x2="80" y2="316" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 4 -->
  <circle cx="80" cy="333" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="80" y="338" text-anchor="middle" class="num" style="fill:#b91c1c">4</text>
  <rect x="110" y="310" width="790" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="110" y="310" width="230" height="46" rx="8" fill="#7c3aed"/>
  <text x="225" y="338" text-anchor="middle" class="badge">ReplicaSet 컨트롤러</text>
  <text x="356" y="338" class="step">원하는 파드 수와 실제를 비교 → 모자란 만큼 파드 생성을 요청한다</text>
  <line x1="80" y1="350" x2="80" y2="376" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 5 -->
  <circle cx="80" cy="393" r="16" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="80" y="398" text-anchor="middle" class="num">5</text>
  <rect x="110" y="370" width="790" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="110" y="370" width="230" height="46" rx="8" fill="#0f766e"/>
  <text x="225" y="398" text-anchor="middle" class="badge">Mutating 웹훅 (Istio·Vault)</text>
  <text x="356" y="398" class="step">파드가 저장되기 직전에 스펙을 고쳐 init 컨테이너와 사이드카를 넣는다</text>
  <line x1="80" y1="410" x2="80" y2="436" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 6 -->
  <circle cx="80" cy="453" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="80" y="458" text-anchor="middle" class="num" style="fill:#b91c1c">6</text>
  <rect x="110" y="430" width="790" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="110" y="430" width="230" height="46" rx="8" fill="#7c3aed"/>
  <text x="225" y="458" text-anchor="middle" class="badge">kube-scheduler</text>
  <text x="356" y="458" class="step">노드가 비어 있는 파드를 감지 → requests 기준으로 노드를 고른다(binding)</text>
  <line x1="80" y1="470" x2="80" y2="496" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 7 -->
  <circle cx="80" cy="513" r="16" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="80" y="518" text-anchor="middle" class="num">7</text>
  <rect x="110" y="490" width="790" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="110" y="490" width="230" height="46" rx="8" fill="#15803d"/>
  <text x="225" y="518" text-anchor="middle" class="badge">kubelet (선택된 노드)</text>
  <text x="356" y="518" class="step">이미지 pull → init을 순서대로 → 컨테이너 시작 → probe 실행</text>
  <line x1="80" y1="530" x2="80" y2="556" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 8 -->
  <circle cx="80" cy="573" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="80" y="578" text-anchor="middle" class="num" style="fill:#b91c1c">8</text>
  <rect x="110" y="550" width="790" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="110" y="550" width="230" height="46" rx="8" fill="#7c3aed"/>
  <text x="225" y="578" text-anchor="middle" class="badge">EndpointSlice 컨트롤러</text>
  <text x="356" y="578" class="step">파드의 Ready 여부를 EndpointSlice에 반영한다 (ready: true여야 트래픽 대상)</text>
  <line x1="80" y1="590" x2="80" y2="616" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 9 -->
  <circle cx="80" cy="633" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="80" y="638" text-anchor="middle" class="num" style="fill:#b91c1c">9</text>
  <rect x="110" y="610" width="790" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="110" y="610" width="230" height="46" rx="8" fill="#2563eb"/>
  <text x="225" y="638" text-anchor="middle" class="badge">istiod</text>
  <text x="356" y="638" class="step">바뀐 엔드포인트를 모든 Envoy(Gateway·사이드카)에 전파 → 트래픽 수신 시작</text>
  <line x1="80" y1="650" x2="80" y2="676" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 10 -->
  <circle cx="80" cy="693" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="80" y="698" text-anchor="middle" class="num" style="fill:#b91c1c">10</text>
  <rect x="110" y="670" width="790" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="110" y="670" width="230" height="46" rx="8" fill="#7c3aed"/>
  <text x="225" y="698" text-anchor="middle" class="badge">Deployment 컨트롤러</text>
  <text x="356" y="698" class="step">새 파드 Ready 확인 → 옛 ReplicaSet을 하나 줄인다 (maxSurge 1 / maxUnavailable 0)</text>

  <!-- note -->
  <rect x="40" y="738" width="880" height="64" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="60" y="764" class="note"><tspan font-weight="700">핵심:</tspan> 컨트롤러끼리는 서로 호출하지 않는다. 모두 API 서버에 쓰고, 다른 컴포넌트가 watch로 보고 반응한다.</text>
  <text x="60" y="788" class="note">그래서 "누가 하나요?"에는 <tspan font-weight="700">"어떤 컨트롤러가, 무엇이 바뀐 걸 보고"</tspan>로 답한다. (= 조정 루프: 원하는 상태 vs 실제 상태)</text>
</svg>
