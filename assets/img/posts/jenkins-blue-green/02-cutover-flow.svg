<svg xmlns="http://www.w3.org/2000/svg" width="760" height="916" viewBox="0 0 760 916" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title>젠킨스 블루/그린 전환 플로우</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="916" rx="12" fill="#FFFFFF"/>
<text x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="600" fill="#2C2C2A">전환 플로우</text>
<text x="720" y="32" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">빌드가 멈추는 구간은 B뿐이다</text>
<rect x="80" y="90" width="400" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<circle cx="104" cy="115" r="12" fill="#0F6E56"/>
<text x="104" y="115" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#FFFFFF">1</text>
<text x="128" y="106" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">컨트롤러 이미지 빌드</text>
<text x="128" y="125" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">plugins.txt(인프라팀 목록) + plugins-custom.txt</text>
<line x1="484" y1="115" x2="500" y2="115" stroke="#C9C7BE" stroke-width="1.6"/>
<text x="506" y="115" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#8A887F">빌드 단계에서 플러그인 충돌을 먼저 잡는다</text>
<line x1="104" y1="140" x2="104" y2="150" stroke="#73726C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="80" y="150" width="400" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<circle cx="104" cy="175" r="12" fill="#0F6E56"/>
<text x="104" y="175" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#FFFFFF">2</text>
<text x="128" y="166" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">그린 PVC 생성 · 첫 붓기</text>
<text x="128" y="185" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">JENKINS_HOME 전체 복사 · 822MB 97초</text>
<line x1="484" y1="175" x2="500" y2="175" stroke="#C9C7BE" stroke-width="1.6"/>
<text x="506" y="175" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#8A887F">블루는 읽기만 해서 운영 중에도 안전하다</text>
<line x1="104" y1="200" x2="104" y2="210" stroke="#73726C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="80" y="210" width="400" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<circle cx="104" cy="235" r="12" fill="#0F6E56"/>
<text x="104" y="235" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#FFFFFF">3</text>
<text x="128" y="226" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">helm install 그린</text>
<text x="128" y="245" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">새 release 이름 · 같은 네임스페이스</text>
<line x1="484" y1="235" x2="500" y2="235" stroke="#C9C7BE" stroke-width="1.6"/>
<text x="506" y="235" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#8A887F">블루 리소스와 이름이 겹치지 않는다</text>
<line x1="104" y1="260" x2="104" y2="270" stroke="#73726C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="80" y="270" width="400" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<circle cx="104" cy="295" r="12" fill="#0F6E56"/>
<text x="104" y="295" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#FFFFFF">4</text>
<text x="128" y="286" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">그린 검증</text>
<text x="128" y="305" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">임시 도메인으로 로그인 · 권한 · 크리덴셜 · 빌드</text>
<line x1="484" y1="295" x2="500" y2="295" stroke="#C9C7BE" stroke-width="1.6"/>
<text x="506" y="295" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#8A887F">DNS를 바꾸기 전에 문제를 다 드러낸다</text>
<rect x="40" y="62" width="6" height="258" rx="3" fill="#0F6E56"/>
<text x="58" y="72" text-anchor="start" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#085041">A. 운영 중에 준비 (영향 없음)</text>
<rect x="80" y="370" width="400" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<circle cx="104" cy="395" r="12" fill="#993C1D"/>
<text x="104" y="395" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#FFFFFF">5</text>
<text x="128" y="386" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">블루 Prepare for Shutdown</text>
<text x="128" y="405" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">새 빌드만 막는다 (젠킨스는 켜져 있음)</text>
<line x1="484" y1="395" x2="500" y2="395" stroke="#C9C7BE" stroke-width="1.6"/>
<text x="506" y="395" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#8A887F">반쯤 쓰인 빌드 기록이 넘어가지 않게</text>
<line x1="104" y1="420" x2="104" y2="430" stroke="#73726C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="80" y="430" width="400" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<circle cx="104" cy="455" r="12" fill="#993C1D"/>
<text x="104" y="455" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#FFFFFF">6</text>
<text x="128" y="446" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">그린 replicas 0</text>
<text x="128" y="465" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">실행 중인 젠킨스에 덮어쓰지 않는다</text>
<line x1="484" y1="455" x2="500" y2="455" stroke="#C9C7BE" stroke-width="1.6"/>
<text x="506" y="455" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#8A887F">파일 충돌 방지</text>
<line x1="104" y1="480" x2="104" y2="490" stroke="#73726C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="80" y="490" width="400" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<circle cx="104" cy="515" r="12" fill="#993C1D"/>
<text x="104" y="515" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#FFFFFF">7</text>
<text x="128" y="506" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">최종 붓기 · plugins/ 제외</text>
<text x="128" y="525" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">그 사이 쌓인 빌드 이력만 · 37초</text>
<line x1="484" y1="515" x2="500" y2="515" stroke="#C9C7BE" stroke-width="1.6"/>
<text x="506" y="515" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#8A887F">새 플러그인을 옛 버전으로 덮지 않게</text>
<line x1="104" y1="540" x2="104" y2="550" stroke="#73726C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="80" y="550" width="400" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<circle cx="104" cy="575" r="12" fill="#993C1D"/>
<text x="104" y="575" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#FFFFFF">8</text>
<text x="128" y="566" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">그린 replicas 1</text>
<text x="128" y="585" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">로그 fully up · 마지막 빌드 기록 확인</text>
<line x1="484" y1="575" x2="500" y2="575" stroke="#C9C7BE" stroke-width="1.6"/>
<text x="506" y="575" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#8A887F">DNS 전에 확인한다</text>
<line x1="104" y1="600" x2="104" y2="610" stroke="#73726C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="80" y="610" width="400" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<circle cx="104" cy="635" r="12" fill="#993C1D"/>
<text x="104" y="635" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#FFFFFF">9</text>
<text x="128" y="626" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">DNS 전환</text>
<text x="128" y="645" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">레코드 값을 그린 LB로 · 옛 값은 기록</text>
<line x1="484" y1="635" x2="500" y2="635" stroke="#C9C7BE" stroke-width="1.6"/>
<text x="506" y="635" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#8A887F">사용자 · 웹훅 주소는 그대로다</text>
<line x1="104" y1="660" x2="104" y2="670" stroke="#73726C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="80" y="670" width="400" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<circle cx="104" cy="695" r="12" fill="#993C1D"/>
<text x="104" y="695" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#FFFFFF">10</text>
<text x="128" y="686" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">블루 replicas 0</text>
<text x="128" y="705" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">삭제 아님 · release · PVC · LB 보존</text>
<line x1="484" y1="695" x2="500" y2="695" stroke="#C9C7BE" stroke-width="1.6"/>
<text x="506" y="695" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#8A887F">두 젠킨스가 동시에 빌드하지 않게</text>
<rect x="40" y="342" width="6" height="378" rx="3" fill="#993C1D"/>
<text x="58" y="352" text-anchor="start" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#712B13">B. 작업 시간 (빌드 중지 약 2분)</text>
<rect x="80" y="770" width="400" height="50" rx="8" fill="#F1EFE8" stroke="#8A887F" stroke-width="1.2" stroke-dasharray="5 4"/>
<circle cx="104" cy="795" r="12" fill="#8A887F"/>
<text x="104" y="795" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#FFFFFF">11</text>
<text x="128" y="786" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">1~2일 관찰 후 블루 정리</text>
<text x="128" y="805" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">release · PVC · NAS 볼륨 · LB 삭제</text>
<line x1="484" y1="795" x2="500" y2="795" stroke="#C9C7BE" stroke-width="1.6"/>
<text x="506" y="795" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#8A887F">Retain이라 NAS는 콘솔에서도 지운다</text>
<rect x="40" y="742" width="6" height="78" rx="3" fill="#8A887F"/>
<text x="58" y="752" text-anchor="start" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#2C2C2A">C. 전환 후</text>
<rect x="40" y="840" width="680" height="54" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="58" y="858" text-anchor="start" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#712B13">문제가 생기면 롤백</text>
<text x="58" y="878" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">블루 replicas 1 → fully up 확인 → DNS를 기록해 둔 옛 LB로 되돌린다 → 그린 replicas 0  (블루를 먼저 올려야 접속 대상이 생긴다)</text>
</svg>
