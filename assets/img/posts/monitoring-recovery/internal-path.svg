<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369A1"/></marker>
  </defs>
  <rect width="940" height="560" fill="#FFFFFF"/>
  <text x="20" y="30" font-size="16" font-weight="700" fill="#111827">같은 VPC 안의 트래픽을 인터넷으로 돌리지 않는다</text>
  <text x="20" y="50" font-size="12" fill="#4B5563">복구 직후(위)와 내부 경로 전환 후(아래). 로드밸런서 수는 그대로다</text>

  <!-- BEFORE -->
  <text x="20" y="86" font-size="13" font-weight="700" fill="#991B1B">복구 직후 — 모든 클라이언트가 공인 도메인을 거친다</text>
  <rect x="20" y="100" width="900" height="170" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
  <rect x="40" y="116" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="125" y="143" text-anchor="middle" font-size="12.5" fill="#111827">관리 클러스터 Prometheus</text>
