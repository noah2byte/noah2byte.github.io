<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" style="max-width:100%;height:auto" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a3B6D11" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3B6D11"/></marker><marker id="a185FA5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#185FA5"/></marker><marker id="a5F5E5A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#5F5E5A"/></marker></defs><rect width="1180" height="760" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#2C2C2A" text-anchor="start">서비스 메시란 — 앱 옆에 프록시를 붙이고, 중앙에서 규칙을 내려준다</text>
<text x="24" y="56" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">앱 코드는 그대로 두고, 앱이 주고받는 네트워크를 옆에 붙은 프록시(Envoy)가 대신 처리한다</text>
<rect x="20" y="80" width="540" height="300" rx="12" fill="#F1EFE8" fill-opacity="0.45" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="7 5"/>
<text x="32" y="100" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="start">메시가 없을 때</text>
<rect x="45" y="120" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="120.0" y="160.0" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">앱 A</text>
<rect x="365" y="120" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="440.0" y="160.0" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">앱 B</text>
<path d="M195 155 L365 155" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a5F5E5A)"/>
<text x="280" y="145" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">평문 HTTP</text>
<rect x="45" y="215" width="470" height="145" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="60" y="238" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="start">앱마다 직접 해야 하는 일</text>
<text x="60" y="262" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· 상대가 진짜 앱 B 인지 확인 (인증), 통신 암호화</text>
<text x="60" y="284" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· 실패하면 재시도, 너무 느리면 끊기 (타임아웃)</text>
<text x="60" y="306" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· 누가 누구를 몇 번 불렀는지 기록 (관측)</text>
<text x="60" y="328" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start">→ 언어·프레임워크마다 따로 구현해야 하고, 빠뜨려도 모른다</text>
<rect x="600" y="80" width="560" height="300" rx="12" fill="#E1F5EE" fill-opacity="0.45" stroke="#0F6E56" stroke-width="1" stroke-dasharray="7 5"/>
<text x="612" y="100" font-size="13" font-weight="700" fill="#04342C" text-anchor="start">메시가 있을 때</text>
<rect x="620" y="120" width="230" height="80" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<rect x="632" y="132" width="95" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="679.5" y="165.0" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">앱 A</text>
<rect x="740" y="132" width="98" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="789.0" y="154" font-size="14" font-weight="700" fill="#173404" text-anchor="middle">Envoy</text>
<text x="789.0" y="174" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">사이드카</text>
<rect x="910" y="120" width="230" height="80" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<rect x="922" y="132" width="98" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="971.0" y="154" font-size="14" font-weight="700" fill="#173404" text-anchor="middle">Envoy</text>
<text x="971.0" y="174" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">사이드카</text>
<rect x="1032" y="132" width="95" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="1079.5" y="165.0" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">앱 B</text>
<path d="M838 160 L922 160" fill="none" stroke="#3B6D11" stroke-width="2" marker-end="url(#a3B6D11)"/>
<text x="880" y="150" font-size="11" font-weight="700" fill="#3B6D11" text-anchor="middle">mTLS</text>
<text x="735" y="216" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">파드 A</text>
<text x="1025" y="216" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">파드 B</text>
<rect x="620" y="235" width="520" height="125" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="635" y="258" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="start">프록시가 대신 해 주는 일</text>
<text x="635" y="282" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· 앱은 평소처럼 HTTP 로 보낸다. 나가는 길에 Envoy 가 가로채 암호화</text>
<text x="635" y="304" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· 받는 쪽 Envoy 가 풀어서 앱에 평문으로 넘긴다</text>
<text x="635" y="326" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">· 재시도·타임아웃·기록도 Envoy 가 한다</text>
<text x="635" y="348" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="start">→ 앱 코드는 한 줄도 안 바뀐다. 파드마다 Envoy 가 하나씩 "옆에 붙는다"</text>
<rect x="20" y="400" width="1140" height="345" rx="12" fill="#E6F1FB" fill-opacity="0.45" stroke="#185FA5" stroke-width="1" stroke-dasharray="7 5"/>
<text x="32" y="420" font-size="13" font-weight="700" fill="#0C447C" text-anchor="start">Istio 의 두 층 — 컨트롤 플레인과 데이터 플레인</text>
<rect x="420" y="435" width="340" height="95" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="590.0" y="457" font-size="14" font-weight="700" fill="#0C447C" text-anchor="middle">istiod</text>
<text x="590.0" y="477" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">컨트롤 플레인 (두뇌, 1개)</text>
<text x="590.0" y="495" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">규칙을 Envoy 설정으로 바꿔 내려준다</text>
<text x="590.0" y="512" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle">인증서 발급 · 사이드카 끼워 넣기</text>
<text x="590" y="555" font-size="11" font-weight="400" fill="#185FA5" text-anchor="middle">설정을 내려준다 (xDS)</text>
<rect x="60" y="590" width="250" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="185.0" y="612" font-size="14" font-weight="700" fill="#412402" text-anchor="middle">ingressgateway</text>
<text x="185.0" y="632" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle">외부 입구 (Envoy)</text>
<path d="M590 530 L590 565 L185 565 L185 590" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a185FA5)"/>
<rect x="330" y="590" width="250" height="70" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="455.0" y="612" font-size="14" font-weight="700" fill="#173404" text-anchor="middle">파드 + Envoy</text>
<text x="455.0" y="632" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">과목 A 앱</text>
<path d="M590 530 L590 565 L455 565 L455 590" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a185FA5)"/>
<rect x="600" y="590" width="250" height="70" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="725.0" y="612" font-size="14" font-weight="700" fill="#173404" text-anchor="middle">파드 + Envoy</text>
<text x="725.0" y="632" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">과목 B 앱</text>
<path d="M590 530 L590 565 L725 565 L725 590" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a185FA5)"/>
<rect x="870" y="590" width="250" height="70" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="995.0" y="612" font-size="14" font-weight="700" fill="#173404" text-anchor="middle">파드 + Envoy</text>
<text x="995.0" y="632" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle">…</text>
<path d="M590 530 L590 565 L995 565 L995 590" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a185FA5)"/>
<text x="590" y="690" font-size="13" font-weight="700" fill="#854F0B" text-anchor="middle">데이터 플레인 — 실제로 트래픽이 지나가는 Envoy 들</text>
<text x="590" y="714" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">비유: istiod = 본사 관리실, 사이드카 = 사무실마다 배치된 경비원, ingressgateway = 건물 정문 안내데스크</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
