<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" style="max-width:100%;height:auto" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a3B6D11" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3B6D11"/></marker><marker id="aA32D2D" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#A32D2D"/></marker><marker id="a185FA5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#185FA5"/></marker></defs><rect width="1180" height="760" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#2C2C2A" text-anchor="start">큰 그림 — 이 PoC 는 "모든 앱을 ArgoCD 로" 의 한 조각이다</text>
<text x="24" y="56" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">왼쪽(AS-IS)의 문제를 조각 단위로 풀고, 조각이 다 맞으면 스테이징에서 한 번에 전환한다</text>
<rect x="20" y="75" width="330" height="560" rx="12" fill="#FCEBEB" fill-opacity="0.45" stroke="#A32D2D" stroke-width="1" stroke-dasharray="7 5"/>
<text x="32" y="95" font-size="13" font-weight="700" fill="#501313" text-anchor="start">AS-IS — 인수인계받은 레거시</text>
<rect x="40" y="110" width="290" height="110" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="52" y="132" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="left">젠킨스가 전부 한다</text>
<text x="52" y="152" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="left">· 백엔드: helm upgrade + values override</text>
<text x="52" y="169" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="left">· 프론트: 빌드 후 kubectl cp 로 파일 주입</text>
<text x="52" y="186" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="left">· ConfigMap: 젠킨스가 직접 생성</text>
<text x="52" y="203" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="left">  → 지금 뭐가 떠 있는지 Git 에 없다</text>
<rect x="40" y="235" width="290" height="95" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="52" y="257" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="left">Istio 는 사람이 깐다</text>
<text x="52" y="277" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="left">· istioctl install + build_operator.sh</text>
<text x="52" y="294" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="left">· 과목 목록이 스크립트에 하드코딩</text>
<text x="52" y="311" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="left">· 설치 방법이 문서로 남지 않았다</text>
<rect x="40" y="345" width="290" height="130" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="52" y="367" font-size="14" font-weight="700" fill="#4A1B0C" text-anchor="left">스크립트가 스크립트를 낳는다</text>
<text x="52" y="387" font-size="12" font-weight="400" fill="#993C1D" text-anchor="left">· 뭐가 있는지 몰라 클러스터에 접속해 확인</text>
<text x="52" y="404" font-size="12" font-weight="400" fill="#993C1D" text-anchor="left">· 그게 불편해 확인용 sh 를 또 만든다</text>
<text x="52" y="421" font-size="12" font-weight="400" fill="#993C1D" text-anchor="left">· 편하려던 스크립트가 구조를 더 복잡하게</text>
<text x="52" y="438" font-size="12" font-weight="400" fill="#993C1D" text-anchor="left">· 레포는 조잡해지고 다음 사람은 또 모른다</text>
<rect x="40" y="490" width="290" height="125" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="52" y="512" font-size="14" font-weight="700" fill="#501313" text-anchor="left">결과</text>
<text x="52" y="532" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="left">· 상태를 알려면 사람이 직접 봐야 한다</text>
<text x="52" y="549" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="left">· 빠뜨려도 아무도 모른다 (게이트웨이 503)</text>
<text x="52" y="566" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="left">· 아는 사람이 떠나면 설치도 못 한다</text>
<text x="52" y="583" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="left">· 러닝 커브 탓으로 치부되기 쉽다</text>
<rect x="380" y="75" width="470" height="560" rx="12" fill="#E6F1FB" fill-opacity="0.45" stroke="#185FA5" stroke-width="1" stroke-dasharray="7 5"/>
<text x="392" y="95" font-size="13" font-weight="700" fill="#0C447C" text-anchor="start">맞춰 온 조각 — Git 에 적힌 대로 클러스터가 된다</text>
<rect x="400" y="110" width="430" height="120" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="412" y="132" font-size="14" font-weight="700" fill="#04342C" text-anchor="left">조각 ① 백엔드 aidt-lm-service → ArgoCD</text>
<text x="412" y="152" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="left">완료 · 앞선 시리즈 (젠킨스에서 ArgoCD로)</text>
<text x="412" y="170" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="left">젠킨스 = 빌드 + 이미지 태그 커밋, 배포 = ArgoCD</text>
<text x="412" y="187" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="left">values 를 환경별 파일로 분리, ApplicationSet, Jira 알림</text>
<text x="412" y="204" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="left">→ "이미지 기반 앱은 이 패턴으로 간다" 를 확립</text>
<rect x="400" y="245" width="430" height="120" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="412" y="267" font-size="14" font-weight="700" fill="#04342C" text-anchor="left">조각 ② 프론트 CSR → SSR 배포 틀</text>
<text x="412" y="287" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="left">완료 · 이 시리즈 4편 (09-16 ~ 10-29)</text>
<text x="412" y="305" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="left">SSR 은 이미지 기반 → 조각 ① 패턴을 그대로 적용</text>
<text x="412" y="322" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="left">nginx.conf 21개 복제 → 헬름 템플릿 1개 + values</text>
<text x="412" y="339" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="left">→ 프론트도 Git 에 배포 상태가 남는다</text>
<rect x="400" y="380" width="430" height="120" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="412" y="402" font-size="14" font-weight="700" fill="#04342C" text-anchor="left">조각 ③ Istio → ArgoCD App of Apps</text>
<text x="412" y="422" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="left">완료 · 이 시리즈 5편 (10-06 ~ 10-08)</text>
<text x="412" y="440" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="left">istioctl + sh → 래퍼 차트 + values 한 줄로 과목 추가</text>
<text x="412" y="457" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="left">PoC 프론트를 mesh 에 편입 (사이드카 + 입구)</text>
<text x="412" y="474" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="left">→ 앱 밑의 플랫폼까지 Git 으로 관리</text>
<rect x="400" y="515" width="430" height="100" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="412" y="537" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="left">남은 조각 ④ ArgoCD 정식 구축</text>
<text x="412" y="557" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="left">인프라 · comm 클러스터 (허브)</text>
<text x="412" y="575" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="left">dev/stg/prod 클러스터를 원격 등록 (허브 앤 스포크)</text>
<text x="412" y="592" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="left">PoC 용 개인 테스트 클러스터 → 정식 위치로</text>
<rect x="880" y="75" width="280" height="560" rx="12" fill="#EAF3DE" fill-opacity="0.45" stroke="#3B6D11" stroke-width="1" stroke-dasharray="7 5"/>
<text x="892" y="95" font-size="13" font-weight="700" fill="#173404" text-anchor="start">발사 — 스테이징부터</text>
<rect x="900" y="110" width="240" height="120" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="912" y="132" font-size="14" font-weight="700" fill="#412402" text-anchor="left">발사 조건</text>
<text x="912" y="152" font-size="12" font-weight="400" fill="#854F0B" text-anchor="left">개발팀 SSR 개발 완료</text>
<text x="912" y="169" font-size="12" font-weight="400" fill="#854F0B" text-anchor="left">+ 빌드 프로파일(dev/stg/prod)</text>
<text x="912" y="186" font-size="12" font-weight="400" fill="#854F0B" text-anchor="left">  분리 완료</text>
<text x="912" y="203" font-size="12" font-weight="400" fill="#854F0B" text-anchor="left">= 스테이징에 바로 올릴 수 있는 때</text>
<rect x="900" y="250" width="240" height="150" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="912" y="272" font-size="14" font-weight="700" fill="#173404" text-anchor="left">스테이징 동시 전환</text>
<text x="912" y="292" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="left">백엔드 + 프론트를 함께 ArgoCD 로</text>
<text x="912" y="309" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="left">(한쪽만 옮기면 배포 체계가 둘)</text>
<text x="912" y="326" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="left">SSR 스택은 새로 병행 구축</text>
<text x="912" y="343" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="left">→ DNS 스위칭, 롤백도 DNS</text>
<text x="912" y="360" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="left">mesh.enabled: true 로 처음부터</text>
<rect x="900" y="420" width="240" height="75" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="912" y="442" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="left">일정 기간 검증</text>
<text x="912" y="462" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="left">성능(TTFB·LCP) · 장애 대응</text>
<rect x="900" y="515" width="240" height="100" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="912" y="537" font-size="14" font-weight="700" fill="#173404" text-anchor="left">운영</text>
<text x="912" y="557" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="left">모든 앱의 빌드·배포 흐름이</text>
<text x="912" y="574" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="left">ArgoCD 기반 하나로 통일</text>
<path d="M350 355 L380 355" fill="none" stroke="#A32D2D" stroke-width="2" marker-end="url(#aA32D2D)"/>
<path d="M850 170 L880 170" fill="none" stroke="#185FA5" stroke-width="2" marker-end="url(#a185FA5)"/>
<path d="M1020 230 L1020 250" fill="none" stroke="#3B6D11" stroke-width="1.6" marker-end="url(#a3B6D11)"/>
<path d="M1020 400 L1020 420" fill="none" stroke="#3B6D11" stroke-width="1.6" marker-end="url(#a3B6D11)"/>
<path d="M1020 495 L1020 515" fill="none" stroke="#3B6D11" stroke-width="1.6" marker-end="url(#a3B6D11)"/>
<path d="M615 230 L615 245" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#a185FA5)"/>
<path d="M615 365 L615 380" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#a185FA5)"/>
<path d="M615 500 L615 515" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a185FA5)"/>
<rect x="20" y="655" width="1140" height="90" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="40" y="682" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="start">지키려 한 원칙 두 가지</text>
<text x="40" y="707" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">① 온고지신 — 전임자가 처음 그린 방향(과목별 게이트웨이, Kaniko 빌드, nginx 앞단)은 살리고, 정리하지 못한 부분(수동 실행·하드코딩·Git 밖 상태)만 컴포넌트 단위로 바꾼다</text>
<text x="40" y="729" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">② 단순해야 운영이 편하다 (키즈노트에서 배운 것) — 스크립트를 하나 더 얹는 대신, 상태를 Git 한 곳에 선언하고 도구(ArgoCD)가 맞추게 한다</text></svg>
