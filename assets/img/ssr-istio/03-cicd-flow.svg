<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" style="max-width:100%;height:auto" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a888780" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#888780"/></marker><marker id="aD3D1C7" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#D3D1C7"/></marker><marker id="a185FA5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#185FA5"/></marker></defs><rect width="1100" height="780" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#2C2C2A" text-anchor="start">배포 흐름 상세 — 젠킨스 스테이지부터 파드 교체까지</text>
<rect x="40" y="55" width="220" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="150.0" y="80.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">젠킨스 잡</text>
<path d="M150 95 L150 730" fill="none" stroke="#D3D1C7" stroke-width="1"/>
<rect x="300" y="55" width="220" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="410.0" y="80.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">Kaniko (jenkins)</text>
<path d="M410 95 L410 730" fill="none" stroke="#D3D1C7" stroke-width="1"/>
<rect x="560" y="55" width="220" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="670.0" y="80.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">Git / NCR</text>
<path d="M670 95 L670 730" fill="none" stroke="#D3D1C7" stroke-width="1"/>
<rect x="820" y="55" width="220" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="930.0" y="80.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">ArgoCD → 클러스터</text>
<path d="M930 95 L930 730" fill="none" stroke="#D3D1C7" stroke-width="1"/>
<rect x="35" y="120" width="230" height="46" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="150" y="139" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">1. 준비</text>
<text x="150" y="157" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">파라미터 정의 (BUILD_ENV=stg)</text>
<rect x="35" y="175" width="230" height="46" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="150" y="194" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">2. 빌드 환경 변수 설정</text>
<text x="150" y="212" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">app·image_name·레지스트리</text>
<rect x="35" y="230" width="230" height="46" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="150" y="249" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">3. 코드 가져오기</text>
<text x="150" y="267" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">앱 소스 → workspace/${JOB_NAME}</text>
<rect x="35" y="285" width="230" height="46" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="150" y="304" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">4. 이미지 태그 결정</text>
<text x="150" y="322" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">&lt;YYYYMMDDHHMMSS&gt;-&lt;커밋해시&gt;</text>
<rect x="35" y="340" width="230" height="46" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="150" y="359" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">5. 컨테이너 이미지 빌드</text>
<text x="150" y="377" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">Dockerfile→ConfigMap, helm install</text>
<rect x="295" y="400" width="230" height="46" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="410" y="419" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">Kaniko 파드 실행</text>
<text x="410" y="437" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">COPY buildpath/workspace/${PROJECT}</text>
<rect x="295" y="455" width="230" height="46" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="410" y="474" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">pnpm install · pnpm build</text>
<text x="410" y="492" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">pnpm@10.15.0 고정</text>
<rect x="555" y="510" width="230" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="670" y="529" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">NCR 푸시</text>
<text x="670" y="547" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">.../front-end-next:&lt;태그&gt;</text>
<rect x="35" y="565" width="230" height="46" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="150" y="584" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">6~7. 빌드 대기 · 로그·정리</text>
<text x="150" y="602" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">kubectl wait → logs → delete</text>
<rect x="35" y="620" width="230" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="150" y="639" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">8. 이미지 태그 Git 반영</text>
<text x="150" y="657" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">yq -e 확인 → ssr.image.tag patch</text>
<rect x="555" y="620" width="230" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="670" y="639" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">git push</text>
<text x="670" y="657" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">helm-repo</text>
<rect x="815" y="675" width="230" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="930" y="694" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">자동 sync → 새 파드</text>
<text x="930" y="712" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="middle">NCR 에서 pull (secret) → 3/3</text>
<path d="M265 363 L410 363 L410 398" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#a185FA5)"/>
<text x="285" y="356" font-size="12" font-weight="400" fill="#185FA5" text-anchor="start">helm install</text>
<path d="M410 446 L410 453" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#a185FA5)"/>
<path d="M525 478 L670 478 L670 508" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#a185FA5)"/>
<text x="530" y="427" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start">← 젠킨스가 받은 소스 (PVC 공유)</text>
<path d="M265 643 L553 643" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#a185FA5)"/>
<path d="M785 643 L930 643 L930 673" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#a185FA5)"/>
<text x="800" y="634" font-size="12" font-weight="400" fill="#185FA5" text-anchor="start">커밋 감지</text>
<path d="M785 533 L1060 533 L1060 673 L1045 690" fill="none" stroke="#888780" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a888780)"/>
<text x="960" y="526" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">이미지 pull</text>
<text x="20" y="735" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">젠킨스는 클러스터 배포를 하지 않는다. 마지막 단계는 Git 커밋이고, 실제 파드 교체는 ArgoCD 가 한다 (백엔드 aidt-lm-service 전환 때 세운 원칙).</text>
<text x="20" y="753" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">Kaniko 와 젠킨스는 비동기다. kubectl wait 가 실패한 채 워크스페이스를 지우면 Kaniko 가 소스를 못 찾는다 (9/18 트러블슈팅).</text></svg>
