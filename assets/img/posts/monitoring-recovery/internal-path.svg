  <text x="305" y="185" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">NAT</text>
  <text x="305" y="203" text-anchor="middle" font-size="11" fill="#4B5563">트래픽 과금</text>
  <path d="M210 138 H230 V176 H248" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M210 188 H248" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M210 238 H230 V200 H248" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="396" y="164" width="96" height="48" rx="24" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="444" y="193" text-anchor="middle" font-size="12.5" fill="#4B5563">인터넷</text>
