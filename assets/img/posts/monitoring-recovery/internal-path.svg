  <path d="M210 408 H700 V370 H714" fill="none" stroke="#0369A1" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="440" y="350" text-anchor="middle" font-size="11.5" fill="#075985">클러스터 내부 서비스 주소 (HTTP)</text>
  <rect x="528" y="456" width="150" height="56" rx="8" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
  <text x="603" y="480" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0C4A6E">사설 ALB</text>
  <text x="603" y="498" text-anchor="middle" font-size="11" fill="#075985">HTTP · 인증서 불필요</text>
  <path d="M210 464 H360 V476 H526" fill="none" stroke="#0369A1" stroke-width="1.6" marker-end="url(#ab)"/>
  <path d="M210 506 H360 V494 H526" fill="none" stroke="#0369A1" stroke-width="1.6" marker-end="url(#ab)"/>
  <text x="440" y="452" text-anchor="middle" font-size="11.5" fill="#075985">도메인 → 사설 ALB (VPC 내부)</text>
  <rect x="716" y="342" width="184" height="56" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="808" y="367" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Mimir 게이트웨이</text>
  <text x="808" y="385" text-anchor="middle" font-size="11" fill="#4B5563">관리 클러스터 안</text>
  <path d="M678 484 H808 V400" fill="none" stroke="#0369A1" stroke-width="1.6" marker-end="url(#ab)"/>
