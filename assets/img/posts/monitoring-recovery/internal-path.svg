  <text x="603" y="212" text-anchor="middle" font-size="11" fill="#991B1B">NACL 허용 필요</text>
  <path d="M492 188 H526" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="716" y="160" width="184" height="56" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="808" y="185" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Mimir 게이트웨이</text>
  <text x="808" y="203" text-anchor="middle" font-size="11" fill="#4B5563">관리 클러스터 안</text>
  <path d="M678 188 H714" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- AFTER -->
  <text x="20" y="306" font-size="13" font-weight="700" fill="#0C4A6E">내부 경로 전환 후 — 같은 클러스터는 서비스 주소로, 다른 클러스터는 사설 ALB로</text>
  <rect x="20" y="320" width="900" height="210" rx="10" fill="#F0F9FF" stroke="#BAE6FD"/>
  <rect x="40" y="336" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="125" y="363" text-anchor="middle" font-size="12.5" fill="#111827">관리 클러스터 Prometheus</text>
  <rect x="40" y="386" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="125" y="413" text-anchor="middle" font-size="12.5" fill="#111827">관리 클러스터 Grafana</text>
