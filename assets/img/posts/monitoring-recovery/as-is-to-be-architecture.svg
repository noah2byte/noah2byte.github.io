<svg width="1000" height="712" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 712" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0369A1"/></marker></defs><rect width="1000" height="712" fill="#FFFFFF"/><text x="20" y="32" font-size="17" fill="#111827" font-weight="700">AS-IS와 TO-BE — 메트릭이 Mimir까지 가는 길</text><text x="20" y="54" font-size="12" fill="#4B5563">왼쪽: 작업 전(모든 경로가 인터넷 경유, 세 군데에서 끊김) · 오른쪽: 작업 후(모든 경로가 VPC 내부, 새 자원 없음)</text><rect x="16" y="70" width="476" height="600" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/><rect x="508" y="70" width="476" height="600" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/><text x="32" y="94" font-size="14" fill="#991B1B" font-weight="700">AS-IS</text><text x="524" y="94" font-size="14" fill="#0C4A6E" font-weight="700">TO-BE</text><rect x="32" y="108" width="104" height="52" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="1"/><text x="84" y="130" font-size="11.5" fill="#111827" font-weight="700" text-anchor="middle">관리 클러스터</text><text x="84" y="148" font-size="10.5" fill="#4B5563" text-anchor="middle">Prometheus</text><rect x="146" y="108" width="104" height="52" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="1"/><text x="198" y="130" font-size="11.5" fill="#111827" font-weight="700" text-anchor="middle">관리 클러스터</text><text x="198" y="148" font-size="10.5" fill="#4B5563" text-anchor="middle">Grafana</text><rect x="260" y="108" width="104" height="52" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="1"/><text x="312" y="130" font-size="11.5" fill="#111827" font-weight="700" text-anchor="middle">운영 클러스터 A</text><text x="312" y="148" font-size="10.5" fill="#4B5563" text-anchor="middle">cluster=a</text><rect x="374" y="108" width="104" height="52" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="6 4"/><text x="426" y="130" font-size="11.5" fill="#6B7280" font-weight="700" text-anchor="middle">운영 클러스터 B</text><text x="426" y="148" font-size="10.5" fill="#4B5563" text-anchor="middle">remoteWrite 없음</text><rect x="524" y="108" width="104" height="52" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="1"/><text x="576" y="130" font-size="11.5" fill="#111827" font-weight="700" text-anchor="middle">관리 클러스터</text><text x="576" y="148" font-size="10.5" fill="#4B5563" text-anchor="middle">Prometheus</text><rect x="638" y="108" width="104" height="52" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="1"/><text x="690" y="130" font-size="11.5" fill="#111827" font-weight="700" text-anchor="middle">관리 클러스터</text><text x="690" y="148" font-size="10.5" fill="#4B5563" text-anchor="middle">Grafana</text><rect x="752" y="108" width="104" height="52" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="1"/><text x="804" y="130" font-size="11.5" fill="#111827" font-weight="700" text-anchor="middle">운영 클러스터 A</text><text x="804" y="148" font-size="10.5" fill="#4B5563" text-anchor="middle">cluster=a</text><rect x="866" y="108" width="104" height="52" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="1"/><text x="918" y="130" font-size="11.5" fill="#111827" font-weight="700" text-anchor="middle">운영 클러스터 B</text><text x="918" y="148" font-size="10.5" fill="#4B5563" text-anchor="middle">cluster=b</text><path d="M84 160 V196" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/><path d="M198 160 V196" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/><path d="M312 160 V196" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="198" width="380" height="44" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="1"/><text x="250" y="218" font-size="12.5" fill="#111827" font-weight="700" text-anchor="middle">NAT Gateway</text><text x="250" y="234" font-size="10.5" fill="#4B5563" text-anchor="middle">출구 공용 출구 IP · 트래픽 과금</text><path d="M250 242 V264" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="266" width="120" height="34" rx="17" fill="#FFFFFF" stroke="#9CA3AF"/><text x="250" y="288" font-size="12" fill="#4B5563" text-anchor="middle">인터넷</text><path d="M250 300 V322" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="324" width="380" height="44" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/><text x="250" y="344" font-size="12.5" fill="#991B1B" font-weight="700" text-anchor="middle">③ 공인 LB 서브넷 NACL</text><text x="250" y="360" font-size="10.5" fill="#991B1B" text-anchor="middle">출구 IP는 8200(Vault)만 허용 → 443 차단</text><path d="M250 368 V390" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#r)"/><rect x="60" y="392" width="380" height="44" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1" stroke-dasharray="6 4"/><text x="250" y="412" font-size="12.5" fill="#991B1B" font-weight="700" text-anchor="middle">① 공인 ALB — 생성 안 됨</text><text x="250" y="428" font-size="10.5" fill="#991B1B" text-anchor="middle">Ingress가 만료 인증서 참조, HTTPS</text><text x="250" y="456" font-size="11" fill="#991B1B" font-weight="700" text-anchor="middle">② DNS mimir.example.com → 옛 LB IP (소멸)</text><path d="M250 436 V490" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#r)"/><rect x="60" y="492" width="380" height="48" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="1"/><text x="250" y="512" font-size="12.5" fill="#111827" font-weight="700" text-anchor="middle">mimir-nginx → Mimir</text><text x="250" y="529" font-size="10.5" fill="#991B1B" text-anchor="middle">수신 0 (약 8개월) · 전송 지연 약 235일</text><text x="36" y="572" font-size="11.5" fill="#92400E">• store-gateway 0/1 · 디스크 풀 · 가짜 테넌트 다수</text><text x="36" y="594" font-size="11.5" fill="#991B1B">• 로그: promtail → loki 게이트웨이 도메인 타임아웃, 폐기</text><text x="36" y="616" font-size="11.5" fill="#92400E">• exporter: 이전 연차 대상 · kafka·redis down</text><text x="36" y="638" font-size="11.5" fill="#991B1B">• 알림: Alertmanager receiver null</text><path d="M576 160 V256" fill="none" stroke="#0369A1" stroke-width="1.5" marker-end="url(#b)"/><path d="M690 160 V256" fill="none" stroke="#0369A1" stroke-width="1.5" marker-end="url(#b)"/><rect x="524" y="258" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#0369A1" stroke-width="1"/><text x="634" y="278" font-size="12" fill="#0C4A6E" font-weight="700" text-anchor="middle">클러스터 내부 서비스 주소</text><text x="634" y="295" font-size="10.5" fill="#0C4A6E" text-anchor="middle">&lt;gateway&gt;.&lt;ns&gt;.svc · HTTP</text><path d="M804 160 V196" fill="none" stroke="#0369A1" stroke-width="1.5" marker-end="url(#b)"/><path d="M918 160 V196" fill="none" stroke="#0369A1" stroke-width="1.5" marker-end="url(#b)"/><rect x="752" y="198" width="220" height="44" rx="8" fill="#FFFFFF" stroke="#0369A1" stroke-width="1"/><text x="862" y="218" font-size="12" fill="#0C4A6E" font-weight="700" text-anchor="middle">DNS</text><text x="862" y="234" font-size="10.5" fill="#0C4A6E" text-anchor="middle">mimir.example.com</text><path d="M862 242 V256" fill="none" stroke="#0369A1" stroke-width="1.5" marker-end="url(#b)"/><rect x="752" y="258" width="220" height="50" rx="8" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="862" y="278" font-size="12.5" fill="#0C4A6E" font-weight="700" text-anchor="middle">사설 ALB · HTTP 80</text><text x="862" y="295" font-size="10.5" fill="#0C4A6E" text-anchor="middle">10.0.3.10 · 사설 LB 전용 서브넷</text><text x="746" y="360" font-size="12" fill="#166534" font-weight="700" text-anchor="middle">NAT · 인터넷 · 공인 NACL · 인증서를</text><text x="746" y="380" font-size="12" fill="#166534" font-weight="700" text-anchor="middle">거치지 않는다</text><text x="746" y="404" font-size="11" fill="#4B5563" text-anchor="middle">공인 ALB 1대 → 사설 ALB 1대 (LB 수 동일)</text><path d="M634 308 V490" fill="none" stroke="#0369A1" stroke-width="1.5" marker-end="url(#b)"/><path d="M862 308 V490" fill="none" stroke="#0369A1" stroke-width="1.5" marker-end="url(#b)"/><rect x="552" y="492" width="380" height="48" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="1"/><text x="742" y="512" font-size="12.5" fill="#111827" font-weight="700" text-anchor="middle">mimir-nginx → Mimir</text><text x="742" y="529" font-size="10.5" fill="#166534" text-anchor="middle">mgmt 89 타깃 · federation(a·b) 수신 중</text><text x="528" y="572" font-size="11.5" fill="#166534">• 메트릭: 세 클러스터 모두 수집 · Grafana 표시 ✓</text><text x="528" y="594" font-size="11.5" fill="#991B1B">• 로그: 변화 없음 — 확인·보완 필요</text><text x="528" y="616" font-size="11.5" fill="#92400E">• exporter: 현재 대상 기준으로 재구성 필요</text><text x="528" y="638" font-size="11.5" fill="#92400E">• store-gateway·알림·Helm 드리프트: 남은 과제</text><text x="20" y="696" font-size="11.5" fill="#4B5563">①②③ = AS-IS에서 끊긴 세 지점. TO-BE에서는 ①(인증서)·③(공인 NACL) 의존이 사라지고, ②(DNS)는 레코드에 연결된 LB만 사설 ALB로 바꿨다.</text></svg>
