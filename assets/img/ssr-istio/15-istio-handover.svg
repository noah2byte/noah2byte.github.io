<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" style="max-width:100%;height:auto" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a5F5E5A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#5F5E5A"/></marker><marker id="a3B6D11" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#3B6D11"/></marker></defs><rect width="1180" height="720" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#2C2C2A" text-anchor="start">Istio 는 어떻게 이 PoC 에 들어왔나 — 인수인계 경위</text>
<text x="24" y="56" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">설치 방법을 모르는 상태에서 시작해, 코드를 읽어 구조를 찾아내고, 관리 방식을 바꾼 순서</text>
<rect x="20" y="80" width="270" height="130" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="32" y="102" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="left">① 전임자가 구축</text>
<text x="32" y="122" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="left">전임자가 Istio 를 구축했다</text>
<text x="32" y="139" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="left">설치·운영 방법은 공유되지 않았다</text>
<text x="32" y="156" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="left">문서도, 인수인계도 없었다</text>
<path d="M290 145 L310 145" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a5F5E5A)"/>
<rect x="310" y="80" width="270" height="130" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="322" y="102" font-size="14" font-weight="700" fill="#26215C" text-anchor="left">② 혼자 구조를 공부</text>
<text x="322" y="122" font-size="12" font-weight="400" fill="#534AB7" text-anchor="left">운영하면서 따로 구조와</text>
<text x="322" y="139" font-size="12" font-weight="400" fill="#534AB7" text-anchor="left">아키텍처를 따로 공부했다</text>
<text x="322" y="156" font-size="12" font-weight="400" fill="#534AB7" text-anchor="left">(사이드카·게이트웨이·mesh)</text>
<path d="M580 145 L600 145" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a5F5E5A)"/>
<rect x="600" y="80" width="270" height="130" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="612" y="102" font-size="14" font-weight="700" fill="#412402" text-anchor="left">③ 전임자 퇴사 → 새 인프라</text>
<text x="612" y="122" font-size="12" font-weight="400" fill="#854F0B" text-anchor="left">새 인프라를 꾸려야 하는데</text>
<text x="612" y="139" font-size="12" font-weight="400" fill="#854F0B" text-anchor="left">Istio 를 어떻게 까는지 아무도 몰랐다</text>
<text x="612" y="156" font-size="12" font-weight="400" fill="#854F0B" text-anchor="left">처음엔 배포 패키지로 접근하기도 했다</text>
<path d="M870 145 L890 145" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a5F5E5A)"/>
<rect x="890" y="80" width="270" height="130" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="902" y="102" font-size="14" font-weight="700" fill="#0C447C" text-anchor="left">④ 코드를 까서 찾았다</text>
<text x="902" y="122" font-size="12" font-weight="400" fill="#185FA5" text-anchor="left">헬름 레포의 서비스 메시 경로에</text>
<text x="902" y="139" font-size="12" font-weight="400" fill="#185FA5" text-anchor="left">실제 설치 방식이 있었다</text>
<text x="902" y="156" font-size="12" font-weight="400" fill="#185FA5" text-anchor="left">istioctl + 별도 sh 스크립트</text>
<rect x="20" y="235" width="560" height="250" rx="12" fill="#FCEBEB" fill-opacity="0.45" stroke="#A32D2D" stroke-width="1" stroke-dasharray="7 5"/>
<text x="32" y="255" font-size="13" font-weight="700" fill="#501313" text-anchor="start">④ 에서 찾아낸 실제 설치 방식 (AS-IS)</text>
<rect x="40" y="270" width="520" height="140" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="55" y="295" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">$ istioctl install --set profile=default          ← 사람이 실행</text>
<text x="55" y="314" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">$ kubectl label namespace &lt;ns&gt; istio-injection=enabled</text>
<text x="55" y="333" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">$ ./build_operator.sh &lt;cluster&gt;                    ← 과목 목록 하드코딩</text>
<text x="55" y="352" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">    → IstioOperator-&lt;cluster&gt;.yml 에 게이트웨이 블록을 이어 붙임</text>
<text x="55" y="371" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">$ istioctl install -f IstioOperator-&lt;cluster&gt;.yml  ← 다시 사람이 실행</text>
<text x="55" y="390" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">(실행 순서·인자는 스크립트를 읽어야만 알 수 있다)</text>
<text x="40" y="435" font-size="12" font-weight="700" fill="#A32D2D" text-anchor="start">문제: 과목 추가 = 스크립트 수정 · 실행 여부가 남지 않음 · 버전 1.23 EOL</text>
<text x="40" y="455" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start">      게이트웨이 하나 빠지면 아무도 모른다 → nginx 재배포 때 503 을 겪었다</text>
<rect x="600" y="235" width="560" height="250" rx="12" fill="#EAF3DE" fill-opacity="0.45" stroke="#3B6D11" stroke-width="1" stroke-dasharray="7 5"/>
<text x="612" y="255" font-size="13" font-weight="700" fill="#173404" text-anchor="start">⑤ ArgoCD 로 배포를 옮기는 김에 Istio 도 (TO-BE)</text>
<rect x="620" y="270" width="520" height="140" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="635" y="295" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">istio-addon (App of Apps 래퍼 차트, project infra)</text>
<text x="635" y="314" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">  ├ wave 0  istio-base     CRD</text>
<text x="635" y="333" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">  ├ wave 1  istiod         컨트롤 플레인</text>
<text x="635" y="352" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">  └ wave 2  gateway × N    values 의 과목 목록만큼</text>
<text x="635" y="371" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">gateways: - name: test-lms   (- name: math ...)  ← 과목 추가는 한 줄</text>
<text x="635" y="390" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">version: 1.23.2   revision: ""     ← 업그레이드는 한 줄 + 리비전</text>
<text x="620" y="435" font-size="12" font-weight="700" fill="#3B6D11" text-anchor="start">같은 것: "과목마다 게이트웨이 하나" 구조와 이름 규칙 (온고지신)</text>
<text x="620" y="455" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="start">바뀐 것: 사람이 실행 → Git 커밋이 곧 설치, 상태는 ArgoCD 화면에서</text>
<path d="M580 360 L600 360" fill="none" stroke="#3B6D11" stroke-width="2" marker-end="url(#a3B6D11)"/>
<rect x="20" y="505" width="360" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="200.0" y="527" font-size="14" font-weight="700" fill="#04342C" text-anchor="middle">⑥ 10-06 설치</text>
<text x="200.0" y="547" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">istio-addon 을 ArgoCD 로</text>
<text x="200.0" y="565" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">caBundle drift · 스키마 검증 등 4건 해결</text>
<text x="200.0" y="582" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">(5편)</text>
<rect x="410" y="505" width="360" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="590.0" y="527" font-size="14" font-weight="700" fill="#04342C" text-anchor="middle">⑦ 10-08 PoC 프론트 mesh 편입</text>
<text x="590.0" y="547" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">사이드카(라벨) → 입구(mesh.enabled)</text>
<text x="590.0" y="565" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">트러블슈팅 15건 · Namespace 코드화</text>
<text x="590.0" y="582" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle">(5편, 6편)</text>
<rect x="800" y="505" width="360" height="100" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="980.0" y="527" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">⑧ 스테이징</text>
<text x="980.0" y="547" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">처음부터 mesh 로</text>
<text x="980.0" y="565" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">운영 istioctl 방식은 그대로 두고</text>
<text x="980.0" y="582" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">새 스택을 이 방식으로 병행 구축</text>
<path d="M380 555 L410 555" fill="none" stroke="#3B6D11" stroke-width="1.6" marker-end="url(#a3B6D11)"/>
<path d="M770 555 L800 555" fill="none" stroke="#3B6D11" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a3B6D11)"/>
<rect x="20" y="625" width="1140" height="80" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="40" y="652" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="start">왜 운영 Istio 는 지금 건드리지 않았나</text>
<text x="40" y="677" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">istioctl install -f 는 클러스터에 operator CR 을 남기지 않아 당장 고장 날 일이 없다(확인: istio-operator 디플로이먼트·CRD 없음).</text>
<text x="40" y="695" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">되돌리기 어려운 운영 변경 대신, 새로 까는 PoC 를 "앞으로 갈 방식"으로 만들고 스테이징 병행 구축 때 적용한다.</text></svg>
