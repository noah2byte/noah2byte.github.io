  <rect x="528" y="156" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#DC2626"/>
  <text x="603" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991B1B">공인 ALB</text>
