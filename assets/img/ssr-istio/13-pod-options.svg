<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" style="max-width:100%;height:auto" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs></defs><rect width="1100" height="470" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#2C2C2A" text-anchor="start">파드 구성 5개 방안 — 왜 nginx + Next.js 사이드카인가</text>
<rect x="20" y="60" width="200" height="210" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="120" y="88" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle">1안 사이드카</text>
<text x="120" y="112" font-size="14" font-weight="700" fill="#3B6D11" text-anchor="middle">채택</text>
<text x="120" y="140" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">nginx + Next 한 파드</text>
<text x="34" y="185" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">· nginx.conf 그대로 보존</text>
<text x="34" y="211" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">· 차트 하나로 관리</text>
<text x="34" y="237" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">· 라우팅은 인프라가</text>
<rect x="236" y="60" width="200" height="210" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="336" y="88" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle">2안 별도 파드</text>
<text x="336" y="112" font-size="14" font-weight="700" fill="#185FA5" text-anchor="middle">차점</text>
<text x="336" y="140" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">nginx 파드 / Next 파드</text>
<text x="250" y="185" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">· nginx.conf 보존</text>
<text x="250" y="211" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">· 차트·배포 단위가 둘로</text>
<text x="250" y="237" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">· 관리 포인트 증가</text>
<rect x="452" y="60" width="200" height="210" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="552" y="88" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle">3안 Next 단독</text>
<text x="552" y="112" font-size="14" font-weight="700" fill="#A32D2D" text-anchor="middle">배제</text>
<text x="552" y="140" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">Next.js 가 전부 처리</text>
<text x="466" y="185" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">· 라우팅이 앱 코드로</text>
<text x="466" y="211" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">· 경로 하나도 개발팀 배포</text>
<text x="466" y="237" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">· 트래픽·앱 관리가 한 덩어리</text>
<rect x="668" y="60" width="200" height="210" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="768" y="88" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle">4안 Istio VS</text>
<text x="768" y="112" font-size="14" font-weight="700" fill="#854F0B" text-anchor="middle">보류</text>
<text x="768" y="140" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">VirtualService 로 라우팅</text>
<text x="682" y="185" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">· 분리 원칙엔 가장 맞음</text>
<text x="682" y="211" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">· gzip·버퍼는 표현 불가</text>
<text x="682" y="237" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">· 팀 숙련도·nginx 잔존</text>
<rect x="884" y="60" width="200" height="210" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="984" y="88" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle">5안 ALB 분기</text>
<text x="984" y="112" font-size="14" font-weight="700" fill="#A32D2D" text-anchor="middle">배제</text>
<text x="984" y="140" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">ALB 경로 규칙</text>
<text x="898" y="185" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">· rewrite-target 미지원</text>
<text x="898" y="211" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">· 외부 서비스 프록시 불가</text>
<text x="898" y="237" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start">· 설정이 여기저기 흩어짐</text>
<rect x="20" y="285" width="1060" height="165" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="40" y="312" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="start">판단 기준 세 가지</text>
<text x="40" y="338" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">① 검증된 설정을 보존한다 — 타임아웃 300s, 업로드 300m, 헤더 버퍼 같은 값은 운영에서 조정된 것이다. 다른 곳에 옮겨 적으면 놓친다</text>
<text x="40" y="362" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">② 관리 포인트를 한 곳에 모은다 — 헬름 차트 하나에 프론트와 웹서버가 같이 있어야 배포 단위와 관리 단위가 일치한다</text>
<text x="40" y="386" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">③ 라우팅 제어권을 인프라에 둔다 — 개발팀 답변: "nginx 가 앞에 있는 방향이 좋겠다", "백엔드 때문에 아직은 프록시가 필요하다"</text>
<text x="40" y="420" font-size="12" font-weight="700" fill="#854F0B" text-anchor="start">Istio(4안)는 배제가 아니라 보류였다 → 차트에 mesh 분기를 넣어두고 10/6~10/8 에 사이드카 + 입구까지 실제로 켰다 (5편)</text></svg>
