<text x="72" y="274" font-size="12" fill="#0F6E56">python:3.12-slim 공식 이미지 + ConfigMap 코드 (commander.py v1.3, diag.py v3.5)</text>
<text x="72" y="294" font-size="12" fill="#0F6E56">Jira 폴링 · 승인자 검증 · 수집 · 규칙 판별 · 마스킹 · LLM 호출 · 출력 검증 · 댓글</text>
