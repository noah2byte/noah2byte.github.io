<text x="550.0" y="357" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">Application istiod</text>
<text x="550.0" y="377" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">chart: istiod · 1.23.2</text>
<text x="405" y="420" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">만드는 것: istiod Deployment</text>
<text x="405" y="440" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">MutatingWebhook (사이드카 주입)</text>
<text x="405" y="460" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">ValidatingWebhook (설정 검증)</text>
<text x="405" y="485" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start">ignoreDifferences: 두 webhook 모두</text>
<rect x="750" y="300" width="330" height="210" rx="12" fill="#E6F1FB" fill-opacity="0.45" stroke="#185FA5" stroke-width="1" stroke-dasharray="7 5"/>
<text x="762" y="320" font-size="13" font-weight="700" fill="#0C447C" text-anchor="start">wave 2 — 02-gateways.yaml (range)</text>
<rect x="770" y="335" width="290" height="60" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
