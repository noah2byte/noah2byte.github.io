<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill:#1e293b; }
    .title { font-size:22px; font-weight:700; }
    .sub { font-size:13px; fill:#475569; }
    .row { font-size:13px; font-weight:700; }
    .bar { font-size:12px; fill:#ffffff; font-weight:700; }
    .t { font-size:13px; }
    .small { font-size:12px; fill:#475569; }
    .num { font-size:13px; font-weight:700; fill:#ffffff; }
    .code { font-family: 'DejaVu Sans Mono','Menlo','Consolas','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',monospace; font-size:11.5px; }
  </style>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#cbd5e1"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="3"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="30" y="40" class="title">kubelet이 파드를 띄우는 순서 (api-backend)</text>
  <text x="30" y="64" class="sub">init 컨테이너는 하나씩 순서대로, 모두 성공해야 다음으로 간다 · 그 뒤 컨테이너 셋이 함께 시작한다</text>

  <!-- phase headers -->
  <text x="262" y="96" text-anchor="middle" class="small">init 1</text>
  <text x="400" y="96" text-anchor="middle" class="small">init 2</text>
  <text x="715" y="96" text-anchor="middle" class="small">컨테이너 실행</text>

  <!-- no-proxy zone -->
  <rect x="200" y="226" width="268" height="186" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="5 4"/>
  <text x="334" y="318" text-anchor="middle" class="t" style="fill:#b91c1c;font-weight:700">istio-proxy 아직 없음</text>
  <text x="334" y="338" text-anchor="middle" class="small">(사이드카는 init이 끝난 뒤 시작)</text>

  <!-- rows -->
  <text x="30" y="133" class="row">istio-init</text>
  <text x="30" y="188" class="row">vault-agent-init</text>
  <text x="30" y="258" class="row">istio-proxy</text>
  <text x="30" y="318" class="row">vault-agent</text>
  <text x="30" y="388" class="row">api-backend (앱)</text>

  <!-- bars -->
  <rect x="200" y="112" width="125" height="32" rx="6" fill="#2563eb"/>
  <text x="262" y="133" text-anchor="middle" class="bar">iptables 설치</text>
  <circle cx="200" cy="112" r="11" fill="#1e293b"/><text x="200" y="117" text-anchor="middle" class="num">1</text>

  <rect x="335" y="167" width="128" height="32" rx="6" fill="#d97706"/>
  <text x="399" y="188" text-anchor="middle" class="bar">Vault 로그인·시크릿</text>
  <circle cx="335" cy="167" r="11" fill="#1e293b"/><text x="335" y="172" text-anchor="middle" class="num">2</text>

  <rect x="475" y="237" width="490" height="32" rx="6" fill="#2563eb"/>
  <text x="680" y="258" text-anchor="middle" class="bar">Envoy: 파드 트래픽 출입을 대신 처리 · 15020에서 probe 대행</text>
  <rect x="475" y="297" width="490" height="32" rx="6" fill="#d97706"/>
  <text x="640" y="318" text-anchor="middle" class="bar">토큰 갱신 · 시크릿 바뀌면 파일 다시 렌더링</text>

  <rect x="475" y="367" width="285" height="32" rx="6" fill="url(#hatch)"/>
  <text x="617" y="388" text-anchor="middle" class="t" style="font-weight:700">기동 중 (initialDelay 50s)</text>
  <rect x="760" y="367" width="205" height="32" rx="6" fill="#15803d"/>
  <text x="862" y="388" text-anchor="middle" class="bar">Ready → 트래픽 수신</text>
  <circle cx="475" cy="367" r="11" fill="#1e293b"/><text x="475" y="372" text-anchor="middle" class="num">3</text>
  <circle cx="760" cy="367" r="11" fill="#1e293b"/><text x="760" y="372" text-anchor="middle" class="num">4</text>

  <!-- probe arrow -->
  <path d="M772,360 C880,350 930,320 930,273" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- axis -->
  <line x1="200" y1="428" x2="970" y2="428" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="970" y="448" text-anchor="end" class="small">시간 →</text>

  <!-- callouts -->
  <rect x="30" y="462" width="460" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="44" y="484" class="t"><tspan font-weight="700">① istio-init</tspan> 파드의 iptables를 바꿔, 이후 모든 트래픽이</text>
  <text x="44" y="504" class="t">나중에 뜰 istio-proxy로 가도록 <tspan font-weight="700">길만 깔아 둔다</tspan>.</text>
  <text x="44" y="522" class="small">"프록시를 통해 설정한다"(X) — 이 시점엔 프록시가 없다</text>

  <rect x="510" y="462" width="460" height="70" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="524" y="484" class="t"><tspan font-weight="700">② vault-agent-init</tspan> SA 토큰으로 Vault 로그인 → /vault/secrets/</text>
  <text x="524" y="504" class="t">에 파일로 렌더링. 프록시가 없는데 어떻게 Vault에 닿나?</text>
  <text x="524" y="522" class="code">excludeOutboundPorts: "8200"</text><text x="760" y="522" class="small">← Vault 포트는 프록시 우회</text>

  <rect x="30" y="542" width="460" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="564" class="t"><tspan font-weight="700">③ 컨테이너 시작</tspan> 앱은 --spring.config.location=</text>
  <text x="44" y="584" class="t">/vault/secrets/application.yml 로 설정을 읽는다</text>

  <rect x="510" y="542" width="460" height="64" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="524" y="564" class="t"><tspan font-weight="700">④ readiness</tspan> kubelet → istio-proxy:15020 → 앱 /readyz</text>
  <text x="524" y="584" class="t">통과하면 Ready → EndpointSlice 등록 (period 5s, 실패 5회)</text>
</svg>
