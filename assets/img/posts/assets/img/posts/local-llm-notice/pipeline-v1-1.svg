<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1120" height="720" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#111827">공지 HTML이 Jira 본문이 되기까지 (v1.1)</text>
  <text x="40" y="68" font-size="13" fill="#6b7280">틀리면 치명적인 값은 코드가 원문 그대로, 문장 번역만 LLM이 한다</text>

  <g font-size="12">
    <rect x="740" y="84" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb"/><text x="760" y="96" fill="#374151">코드 (원문 그대로)</text>
    <rect x="880" y="84" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706"/><text x="900" y="96" fill="#374151">LLM</text>
    <rect x="950" y="84" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626"/><text x="970" y="96" fill="#374151">검사</text>
  </g>

  <!-- source -->
  <rect x="40" y="120" width="220" height="440" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="150" y="150" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">공지 HTML</text>
  <g font-size="12" fill="#374151">
    <rect x="60" y="170" width="180" height="56" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="150" y="194" text-anchor="middle">도입부 · 권고 조치</text>
    <text x="150" y="212" text-anchor="middle" fill="#6b7280">(버전 목록)</text>
    <rect x="60" y="236" width="180" height="56" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="150" y="260" text-anchor="middle">보안 표</text>
    <text x="150" y="278" text-anchor="middle" fill="#6b7280">(제목 · Severity)</text>
    <rect x="60" y="302" width="180" height="56" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="150" y="326" text-anchor="middle">CVE 섹션 × N</text>
    <text x="150" y="344" text-anchor="middle" fill="#6b7280">(설명 · 영향 버전 · CVSS)</text>
    <rect x="60" y="368" width="180" height="56" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="4 3"/>
    <text x="150" y="392" text-anchor="middle" fill="#9ca3af">버그 수정 목록</text>
    <text x="150" y="410" text-anchor="middle" fill="#9ca3af">업데이트 안내 → 읽지 않음</text>
    <rect x="60" y="434" width="180" height="56" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="150" y="458" text-anchor="middle">업그레이드 주의사항</text>
    <text x="150" y="476" text-anchor="middle" fill="#6b7280">(다운타임 · 마이그레이션)</text>
    <text x="150" y="532" text-anchor="middle" fill="#6b7280" font-size="11">메뉴 · 사이드바 · 푸터는</text>
    <text x="150" y="548" text-anchor="middle" fill="#6b7280" font-size="11">TextExtractor가 먼저 버린다</text>
  </g>

  <!-- code: table -->
  <rect x="320" y="236" width="300" height="122" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="470" y="262" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">extract_security_table · cve_sections</text>
  <text x="470" y="286" font-size="12" fill="#1e40af" text-anchor="middle">표 → CVE · 심각도 (앵커에서 CVE 번호)</text>
  <text x="470" y="306" font-size="12" fill="#1e40af" text-anchor="middle">섹션 → CVSS · 설명 문단</text>
  <text x="470" y="330" font-size="12" fill="#1e40af" text-anchor="middle">표 건수 ≠ 섹션 건수 → 경고 문구</text>
  <text x="470" y="348" font-size="11" fill="#3b82f6" text-anchor="middle">auth_fact: 원문에서 인증 여부 읽기</text>

  <!-- llm: overview -->
  <rect x="320" y="150" width="300" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="470" y="176" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle">LLM 개요 (3문장)</text>
  <text x="470" y="198" font-size="12" fill="#92400e" text-anchor="middle">입력 = 도입부 + 주의사항 (overview_source)</text>

  <!-- llm: per CVE -->
  <rect x="320" y="380" width="300" height="84" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="470" y="406" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle">LLM 번역 · CVE마다 1회</text>
  <text x="470" y="428" font-size="12" fill="#92400e" text-anchor="middle">입력 = 제목 + 설명 문단 (약 150토큰)</text>
  <text x="470" y="448" font-size="12" fill="#92400e" text-anchor="middle">주어는 코드가 정해 줌 ("인증된 사용자가")</text>

  <!-- check -->
  <rect x="320" y="486" width="300" height="74" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="470" y="512" font-size="14" font-weight="700" fill="#7f1d1d" text-anchor="middle">check_translation · check_overview</text>
  <text x="470" y="534" font-size="12" fill="#991b1b" text-anchor="middle">가짜 CVE · 숫자 · 잘림 · 인증 반전 · 위험 주장</text>
  <text x="470" y="550" font-size="12" fill="#991b1b" text-anchor="middle">실패 → 재시도 → 영어 원문</text>

  <!-- arrows from source -->
  <path d="M240,198 L280,198 L280,185 L316,185" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M240,462 L270,462 L270,200 L316,200" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="240" y1="264" x2="316" y2="264" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="240" y1="330" x2="316" y2="330" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="470" y1="358" x2="470" y2="376" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="470" y1="464" x2="470" y2="482" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M620,185 L640,185 L640,520 L624,520" fill="none" stroke="#374151" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- output -->
  <rect x="690" y="120" width="390" height="440" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="885" y="150" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">Jira 이슈 본문 (위 → 아래)</text>
  <g font-size="12">
    <rect x="710" y="168" width="350" height="84" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="726" y="190" font-weight="700" fill="#1e3a8a">① 원문 보안 표</text>
    <text x="726" y="210" fill="#1e40af">보안 취약점 12건: Critical 1 · High 2 · …</text>
    <text x="726" y="228" fill="#1e40af">| 심각도 | CVE | CVSS | 제목 (원문) |</text>
    <text x="726" y="244" fill="#1e40af" font-size="11">AI를 거치지 않는다 → 판단의 기준</text>
    <rect x="710" y="262" width="350" height="44" rx="6" fill="#fff7ed" stroke="#fdba74"/>
    <text x="726" y="289" fill="#9a3412">② "AI 요약은 틀릴 수 있다 …" 경고문</text>
    <rect x="710" y="316" width="350" height="44" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="726" y="343" fill="#78350f">③ 개요 (AI, 3문장)</text>
    <rect x="710" y="370" width="350" height="56" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="726" y="394" font-weight="700" fill="#1e3a8a">④ 업그레이드 주의사항 (원문 그대로)</text>
    <text x="726" y="414" fill="#1e40af" font-size="11">다운타임 여부는 원문으로 확인</text>
    <rect x="710" y="436" width="350" height="104" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="726" y="460" font-weight="700" fill="#78350f">⑤ 취약점별 설명 (심각도순)</text>
    <text x="726" y="482" fill="#1e40af">- CVE-… (Critical):</text>
    <text x="852" y="482" fill="#92400e">비인증 사용자가 …</text>
    <text x="726" y="502" fill="#6b7280" font-size="11">앞부분(CVE · 심각도)은 코드, 콜론 뒤만 AI</text>
    <text x="726" y="522" fill="#6b7280" font-size="11">검사 실패 시 "(자동 번역 실패, 원문)"</text>
  </g>
  <line x1="620" y1="297" x2="706" y2="210" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="620" y1="500" x2="706" y2="345" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M240,470 C470,640 600,620 706,400" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <line x1="620" y1="523" x2="706" y2="488" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="40" y="590" width="1040" height="104" rx="10" fill="#fafafa" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="60" y="618" font-size="14" font-weight="700" fill="#111827">v1과 다른 점</text>
  <text x="60" y="642" font-size="12" fill="#374151">· v1은 보안 표를 '중복'으로 버리고 본문을 2000자 청크로 잘라 LLM이 CVE · 심각도 · 버전까지 정리하게 했다 → 19.5.1에서 심각도 · CVE 환각</text>
  <text x="60" y="662" font-size="12" fill="#374151">· v1.1은 필요한 부분만 골라 쓴다. 버그 수정 목록은 읽지 않고, 숫자 정보는 코드가 원문 그대로 붙이고, LLM은 짧은 문단 번역만 한다</text>
  <text x="60" y="682" font-size="12" fill="#374151">· 남은 한계: 번역의 미묘한 뜻 차이, 우리 버전 해당 여부 판단 없음 → 다음 과제</text>
</svg>
