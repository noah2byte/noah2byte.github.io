<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<title>젠킨스 플러그인 적용 경로 비교</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="560" rx="12" fill="#FFFFFF"/>
<text x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="17" font-weight="600" fill="#2C2C2A">플러그인은 어디서 오는가</text>
<text x="720" y="32" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">이번 작업에서 가장 많이 막힌 곳</text>
<rect x="40" y="54" width="330" height="36" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/>
<text x="205" y="72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">이전 운영 (의도와 달랐던 실제)</text>
<rect x="55" y="108" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#8A887F" stroke-width="1.2"/><text x="205.0" y="126.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">이미지 ref/plugins · 121개</text><text x="205.0" y="146.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">plugins.txt를 이미지에 구워 둠</text>
<rect x="55" y="196" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/><text x="205.0" y="214.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">installPlugins: 켜짐</text><text x="205.0" y="234.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">init 컨테이너가 빈 볼륨으로 위를 덮음</text>
<text x="205" y="268" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="600" fill="#712B13">이미지 플러그인이 가려져 적용되지 않음</text>
<line x1="205" y1="282" x2="205" y2="326" stroke="#73726C" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="119.45833333333333" y="294" width="171.08333333333334" height="20" rx="4" fill="#FFFFFF"/><text x="205" y="304" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#5F5E5A">차트 init 컨테이너가 설치</text>
<rect x="55" y="328" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#8A887F" stroke-width="1.2"/><text x="205.0" y="346.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">JENKINS_HOME/plugins · 102개</text><text x="205.0" y="366.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">차트 설치분 + UI 설치분이 쌓임</text>
<rect x="55" y="420" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#8A887F" stroke-width="1.2" stroke-dasharray="5 4"/><text x="205.0" y="438.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">UI(Plugin Manager)에서 설치</text><text x="205.0" y="458.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">JENKINS_HOME에 바로 저장</text>
<line x1="205" y1="420" x2="205" y2="390" stroke="#73726C" stroke-width="1.6" marker-end="url(#a)"/>
<text x="55" y="504" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">· 이미지 목록은 한 번도 적용된 적이 없었다</text>
<text x="55" y="524" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">· 새 코어에 옛 플러그인이 남아 기동 실패</text>
<rect x="390" y="54" width="330" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="555" y="72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">지금 (코드 기준 + UI 허용)</text>
<rect x="405" y="108" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#8A887F" stroke-width="1.2"/><text x="555.0" y="126.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">이미지 ref/plugins · 151개</text><text x="555.0" y="146.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">plugins.txt + plugins-custom.txt</text>
<line x1="555" y1="168" x2="555" y2="326" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#g)"/>
<rect x="511.1458333333333" y="200" width="87.70833333333333" height="20" rx="4" fill="#FFFFFF"/><text x="555" y="210" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#0F6E56">기동 시 복사</text>
<rect x="474.2916666666667" y="226" width="161.41666666666666" height="20" rx="4" fill="#FFFFFF"/><text x="555" y="236" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A">JENKINS_HOME에 없는 것만</text>
<rect x="418.375" y="252" width="273.25" height="20" rx="4" fill="#FFFFFF"/><text x="555" y="262" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A">PLUGINS_FORCE_UPGRADE면 상위 버전으로 교체</text>
<rect x="481.625" y="286" width="146.75" height="20" rx="4" fill="#FFFFFF"/><text x="555" y="296" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A">installPlugins: false</text>
<rect x="405" y="328" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="555.0" y="346.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">JENKINS_HOME/plugins</text><text x="555.0" y="366.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">overwritePlugins: false · 재시작해도 유지</text>
<rect x="405" y="420" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#8A887F" stroke-width="1.2" stroke-dasharray="5 4"/><text x="555.0" y="438.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">UI(Plugin Manager)에서 설치</text><text x="555.0" y="458.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">plugins-custom.txt에도 한 줄 추가</text>
<line x1="555" y1="420" x2="555" y2="390" stroke="#73726C" stroke-width="1.6" marker-end="url(#a)"/>
<text x="405" y="504" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">· plugins.txt는 인프라팀 목록을 그대로 복사</text>
<text x="405" y="524" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">· 우리 목록만 plugins-custom.txt로 따로 관리</text>
</svg>
