<text x="72" y="454" font-size="12" fill="#534AB7">llama.cpp server + Qwen3-4B Q4_K_M (Apache 2.0) · OpenAI 호환 API</text>
<text x="72" y="474" font-size="12" fill="#534AB7">CPU 4 / 메모리 8Gi (VM 사양과 동일) · --cache-ram 1024 · 모델: 노드 디스크</text>
<text x="72" y="494" font-size="12" fill="#534AB7">권한 없음: 쿠버네티스 토큰 미탑재, 텍스트를 받아 텍스트만 돌려준다</text>

