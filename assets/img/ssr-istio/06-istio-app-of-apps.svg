<text x="915.0" y="377" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">chart: gateway · 목록 수만큼</text>
<text x="770" y="420" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">만드는 것: ingressgateway-test-lms</text>
<text x="770" y="440" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">라벨 istio: ingressgateway-test-lms</text>
<text x="770" y="460" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">Service NodePort 80→8080 / 443→8443</text>
<text x="770" y="485" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start">skipSchemaValidation: true</text>
