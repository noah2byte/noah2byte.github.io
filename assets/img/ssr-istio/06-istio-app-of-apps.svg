<text x="185.0" y="357" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">Application istio-base</text>
<text x="185.0" y="377" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">chart: base · 1.23.2</text>
<text x="40" y="420" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">만드는 것: CRD (Gateway, VirtualService …)</text>
<text x="40" y="440" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">ValidatingWebhook (istiod-default-validator)</text>
<text x="40" y="465" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start">ignoreDifferences: caBundle, failurePolicy</text>
<text x="40" y="485" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">syncOptions: ServerSideApply (CRD 가 커서)</text>
<rect x="385" y="300" width="330" height="210" rx="12" fill="#E6F1FB" fill-opacity="0.45" stroke="#185FA5" stroke-width="1" stroke-dasharray="7 5"/>
